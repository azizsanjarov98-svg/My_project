<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money &amp; Tenses Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: an exam booklet. Sticky task index on the left, task sheets stacked in one reading column, a check bar pinned to the bottom. */
:root{
  --bg:#E8ECF2; --sheet:#FFFFFF; --ink:#131A2B; --muted:#596379; --line:#D2D8E3;
  --accent:#2443C4; --accent-ink:#FFFFFF; --mark:#FFE36E; --mark-ink:#131A2B; --gapbg:#F2F4F9;
  --ok:#1B7A45; --ok-bg:#E1F3E8; --bad:#C0352B; --bad-bg:#FBE6E3;
  --t-money:#13765A; --t-comp:#2443C4; --t-prep:#A1327F; --t-tense:#A95400; --t-speak:#0B6E8A; --t-write:#6A47C2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D121E; --sheet:#151C2C; --ink:#E6EAF3; --muted:#9AA4BA; --line:#283149;
    --accent:#8FA6FF; --accent-ink:#0D121E; --mark:#E9C64A; --mark-ink:#131A2B; --gapbg:#1C2438;
    --ok:#5ED493; --ok-bg:#14301F; --bad:#FF8B7F; --bad-bg:#3A1B19;
    --t-money:#4FD1A5; --t-comp:#8FA6FF; --t-prep:#F08AD0; --t-tense:#F3A64B; --t-speak:#55C8E6; --t-write:#B49CFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D121E; --sheet:#151C2C; --ink:#E6EAF3; --muted:#9AA4BA; --line:#283149;
  --accent:#8FA6FF; --accent-ink:#0D121E; --mark:#E9C64A; --mark-ink:#131A2B; --gapbg:#1C2438;
  --ok:#5ED493; --ok-bg:#14301F; --bad:#FF8B7F; --bad-bg:#3A1B19;
  --t-money:#4FD1A5; --t-comp:#8FA6FF; --t-prep:#F08AD0; --t-tense:#F3A64B; --t-speak:#55C8E6; --t-write:#B49CFF;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sheet);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--ink);text-decoration:none;display:flex;gap:10px;align-items:center;letter-spacing:-.01em}
.brand .logo{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--sheet);font:700 13px var(--f-mono)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:700 14px var(--f-body);padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;white-space:nowrap}
.tab:hover{border-color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.tswitch{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.tswitch input{width:18px;height:18px;accent-color:var(--accent)}

/* home */
.hero{padding-block:44px 8px;display:grid;gap:12px}
.kicker{font:700 12.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,6.4vw,70px);line-height:1;letter-spacing:-.03em;margin:0;text-wrap:balance}
h1 .hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 90%,transparent 90%);color:var(--ink)}
.lead{max-width:64ch;color:var(--muted);font-size:18px;margin:0}
h2{font-family:var(--f-display);font-size:26px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;padding-block:24px 8px}
.vcard{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:12px;align-content:start;color:var(--ink);text-decoration:none;transition:transform .15s,border-color .15s}
.vcard:hover{border-color:var(--ink);transform:translateY(-2px)}
.vcard .lv{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.vcard .big{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.9;letter-spacing:-.03em}
.vcard .vn{font:700 13px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.vcard .meta{display:flex;gap:14px;flex-wrap:wrap;font:600 14px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.vcard .go{font-weight:700;color:var(--accent)}
.section{padding-block:28px;display:grid;gap:14px}
.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:14px}
table.cov{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
table.cov th,table.cov td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cov thead th{font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
table.cov tbody tr:last-child td{border-bottom:none}
table.cov td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.how li{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:4px}
.how b{font-family:var(--f-display);font-size:17px}
.foot{padding-block:24px 40px;color:var(--muted);font-size:14px}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{--tc:var(--accent);font:700 12px var(--f-body);padding:3px 9px;border-radius:999px;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);border:1px solid color-mix(in srgb,var(--tc) 38%,transparent);white-space:nowrap}

/* variant page */
.vhead{padding-block:28px 18px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.vhead .ttl{display:grid;gap:6px;min-width:0}
.vhead h1{font-size:clamp(32px,5vw,52px)}
.vhead .sub{color:var(--muted);margin:0;max-width:60ch}
.stud{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:grid;gap:4px;font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input{font:400 16px var(--f-body);padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);width:min(280px,100%)}
.ttimer{display:flex;gap:8px;align-items:center;background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:5px 6px 5px 12px}
.ttimer .clock{font-size:20px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start;padding-bottom:28px}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 170px);overflow:auto}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.toc a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3}
.toc a:hover{background:var(--sheet)}
.toc .nn{font:700 12px var(--f-mono);color:var(--muted)}
.toc .ns{font:700 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.toc .ns.good{color:var(--ok)} .toc .ns.weak{color:var(--bad)}
.tasks{display:grid;gap:18px;min-width:0}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.toc{position:static;max-height:none;overflow-x:auto;overflow-y:visible}
  .toc ol{display:flex;gap:6px;padding-bottom:4px}
  .toc a{display:flex;white-space:nowrap;border:1px solid var(--line);background:var(--sheet)}
  .toc .tt{display:none}
}

/* task sheet */
.task{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:22px clamp(16px,3.2vw,34px) 26px;display:grid;gap:16px;scroll-margin-top:84px;min-width:0}
.task-h{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.tno{flex:none;display:grid;place-items:center;width:46px;height:46px;border:2px solid var(--ink);border-radius:11px;font:700 17px var(--f-mono)}
.task-h .hd{display:grid;gap:6px;min-width:0;flex:1 1 260px}
.task-title{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.pts{font:700 13px var(--f-mono);color:var(--muted);white-space:nowrap;padding-top:4px}
.pts.got{color:var(--ink)}
.instr{font-weight:700;margin:0;max-width:72ch}
.note{margin:0;color:var(--muted);font-size:15px}
.items{margin:0;padding-left:1.7em;display:grid;gap:12px;line-height:2.15}
.items>li{padding-left:4px}
.items>li::marker{font:700 .82em var(--f-mono);color:var(--muted)}

.gw{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap;max-width:100%;vertical-align:baseline}
input.gap,select.gsel{font:inherit;font-size:16px;line-height:1.3;color:var(--ink);background:var(--gapbg);border:none;border-bottom:2px solid var(--ink);border-radius:5px 5px 0 0;padding:3px 7px;max-width:100%}
input.gap{min-width:6ch}
input.gap.wide{width:100%!important}
select.gsel{padding-right:4px;cursor:pointer;max-width:min(100%,320px)}
select.gsel.sm{min-width:58px}
.gw.ok input.gap,.gw.ok select.gsel{border-bottom-color:var(--ok);background:var(--ok-bg)}
.gw.bad input.gap,.gw.bad select.gsel{border-bottom-color:var(--bad);background:var(--bad-bg)}
.fix{font:700 14px var(--f-body);color:var(--ok)}
.fix:empty{display:none}
.key{display:none;font:700 12.5px var(--f-mono);background:var(--mark);color:var(--mark-ink);padding:1px 7px;border-radius:5px;line-height:1.6}
body.teacher .key{display:inline-block}
.wide-w{display:flex;width:100%}

.box{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1.5px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:12px}
.box span{font-weight:700;padding:3px 10px;border-radius:7px;background:var(--gapbg)}
.box .bl{font:700 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:none;padding:5px 4px 0 0}

.pic{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--gapbg)}
.pic svg{display:block;width:100%;height:auto;max-width:100%}
.pic figcaption{font-size:14px;color:var(--muted);padding:8px 14px}
.scene text{font-family:var(--f-body)}
.scene .em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* multiple choice */
.mc{line-height:1.6}
.mc .q{display:block}
.blank{display:inline-block;min-width:5ch;border-bottom:2px solid var(--ink);margin:0 2px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{display:inline-flex;align-items:center;gap:8px;padding:5px 13px 5px 9px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;line-height:1.4}
.opt input{width:17px;height:17px;margin:0;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
body.teacher .opt.is-key{box-shadow:0 0 0 3px var(--mark)}

/* matching */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 28px}
.mleft{line-height:1.5;gap:10px}
.mleft li .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mright{list-style:none;padding:0;margin:0;display:grid;gap:9px;align-content:start}
.mright li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:baseline}
.let{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--sheet);font:700 13px var(--f-mono)}
@media (max-width:720px){.match{grid-template-columns:minmax(0,1fr)}}

/* transformations, errors, order */
.tf li{display:grid;gap:4px;line-height:1.6}
.orig{color:var(--ink)}
.kw{display:inline-block;font:700 12.5px var(--f-mono);letter-spacing:.1em;background:var(--ink);color:var(--sheet);padding:2px 9px;border-radius:5px;justify-self:start}
.stem{line-height:2.15}
.err .orig{font-style:italic}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{font-weight:700;padding:2px 9px;border:1.5px solid var(--line);border-radius:7px;line-height:1.6}
.sentence{line-height:2.2;margin:0}
.letter{background:var(--gapbg);border-radius:12px;padding:18px clamp(14px,3vw,26px);display:grid;gap:4px}
.letter p{margin:0;line-height:2.2}
.letter .from{font:700 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* spec table */
.spec{overflow-x:auto}
.spec table{border-collapse:collapse;min-width:360px;width:100%;max-width:560px;font-variant-numeric:tabular-nums}
.spec th,.spec td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:left}
.spec thead th{font-family:var(--f-display);font-size:18px}
.spec td:first-child{color:var(--muted);font-weight:700;font-size:15px}

/* speaking & writing */
.prompts{margin:0;padding-left:1.6em;display:grid;gap:8px;line-height:1.5}
.prompts li::marker{font:700 .85em var(--f-mono);color:var(--muted)}
.help{display:grid;gap:8px;padding:14px 16px;border-radius:12px;background:var(--gapbg)}
.help .bl{font:700 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.help .phr{display:flex;flex-wrap:wrap;gap:6px}
.help .phr span{background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:2px 9px;font-size:15px}
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rcard{border:2px solid var(--ink);border-radius:14px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.rcard b{font-family:var(--f-display);font-size:18px}
.timers{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.clock{font:700 26px var(--f-mono);font-variant-numeric:tabular-nums;min-width:4.2ch}
.clock.done{color:var(--bad)}
.tmark{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 14px;border:1.5px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:12px}
.tmark label{font-weight:700;display:flex;gap:8px;align-items:center}
.tmark select{font:700 15px var(--f-mono);padding:5px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
.tmark .rub{font-size:14px;color:var(--muted);flex:1 1 260px}
textarea.wr{font:inherit;font-size:16px;line-height:1.6;width:100%;min-height:240px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--gapbg);color:var(--ink);resize:vertical}
.wstat{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.wstat b{color:var(--ink);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wstat .y{color:var(--ok)}

/* buttons, bar, result */
.btn{font:700 15px var(--f-body);padding:9px 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--gapbg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{font-size:14px;padding:6px 12px}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.bar{position:sticky;bottom:0;z-index:8;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px}
.bar .score{margin-left:auto;font:700 15px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .score b{color:var(--ink)}
.result{background:var(--sheet);border:2px solid var(--ink);border-radius:16px;padding:22px clamp(16px,3vw,32px);display:grid;gap:18px}
.res-top{display:flex;flex-wrap:wrap;gap:16px 36px;align-items:flex-end}
.res-top .pc{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.03em}
.res-top .grade{display:grid;gap:2px}
.res-top .grade b{font-family:var(--f-display);font-size:34px;line-height:1}
.res-top small{font:700 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.res-nums{display:grid;gap:2px;font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.tbars{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.tbars li{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:15px}
.tbars .track{height:10px;border-radius:5px;background:var(--gapbg);overflow:hidden}
.tbars .fill{height:100%;border-radius:5px;background:var(--tc,var(--accent))}
.tbars .v{font:700 13px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.tbars li{grid-template-columns:minmax(0,1fr) 80px}.tbars .track{grid-column:1 / -1;order:3}}
@media (max-width:700px){header.top{position:static}.tswitch{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><span class="logo">B1</span>Money &amp; Tenses</a>
    <nav class="tabs" id="tabs" aria-label="Варианты"></nav>
    <label class="tswitch" title="Показывает правильные ответы прямо в заданиях"><input type="checkbox" id="teacher-toggle"> Режим учителя</label>
  </div>
</header>
<main id="main"></main>

<script>
/* ---------- topics ---------- */
const TOPICS = {
  money:   {label:"Money phrases", c:"--t-money"},
  comp:    {label:"Comparison", c:"--t-comp"},
  adjprep: {label:"Adjectives + prepositions", c:"--t-prep"},
  verbprep:{label:"Verbs + prepositions", c:"--t-prep"},
  simple:  {label:"Simple tenses", c:"--t-tense"},
  cont:    {label:"Continuous tenses", c:"--t-tense"},
  perf:    {label:"Perfect tenses", c:"--t-tense"},
  perfcont:{label:"Perfect Continuous", c:"--t-tense"},
  mixed:   {label:"Mixed tenses", c:"--t-tense"},
  speak:   {label:"Speaking", c:"--t-speak"},
  write:   {label:"Writing", c:"--t-write"}
};
const OK_WORDS = ["correct","ok","✓","✔","+","no mistake","right","c"];
const SPEAK_RUBRIC = "Grammar 0–3 · Vocabulary of the unit 0–3 · Fluency 0–2 · Pronunciation 0–2";

/* ---------- pictures (inline SVG) ---------- */
const em=(x,y,c,s=40,extra="")=>`<text class="em" x="${x}" y="${y}" font-size="${s}" text-anchor="middle" dominant-baseline="central" ${extra}>${c}</text>`;

const tag=(x,y,t)=>`<g><rect x="${x}" y="${y}" width="${t.length*13+22}" height="34" rx="8" fill="#131A2B"/><text x="${x+11}" y="${y+18}" font-size="20" font-weight="800" fill="#FFFFFF" dominant-baseline="central">${t}</text></g>`;
const svg=(w,h,body,title)=>`<svg class="scene" viewBox="0 0 ${w} ${h}" role="img" aria-label="${title}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;

      ctx.reg({id,kind:"select",ans:ans[0]});
      const o=bank.slice().sort((a,b)=>a.localeCompare(b,"en",{sensitivity:"base"}));
      return `<span class="gw" id="${id}-w"><select class="gsel" id="${id}" aria-label="Choose a phrase"><option value="">— choose —</option>${o.map(x=>`<option value="${attr(x)}">${x}</option>`).join("")}</select><span class="fix"></span><span class="key">${attr(ans[0])}</span></span>`;
    }
    ctx.reg({id,kind:"text",ans});
    return gapHTML(id,ans,false);
  }).replace(/\{\{(.+?)\}\}/g,(m,inner)=>{
    const parts=inner.split("/"); const id=ctx.id();
    const correct=parts.find(p=>p.endsWith("*")).slice(0,-1);
    const opts=shuffle(parts.map(p=>p.replace(/\*$/,"")),id);
    ctx.reg({id,kind:"select",ans:correct});
    return `<span class="gw" id="${id}-w"><select class="gsel" id="${id}" aria-label="Choose"><option value="">…</option>${opts.map(o=>`<option value="${attr(o)}">${o}</option>`).join("")}</select><span class="fix"></span><span class="key">${attr(correct)}</span></span>`;
  });
}
const blank=q=>q.replace("___",'<span class="blank" aria-label="gap">&nbsp;</span>');

function body(t,ctx,test,ti){
  switch(t.type){
    case "gap": case "choice":
      return `<ol class="items">${t.items.map(i=>`<li>${inline(i,ctx)}</li>`).join("")}</ol>`;
    case "bank":
      return `<div class="box"><span class="bl">Box</span>${t.bank.map(b=>`<span>${b}</span>`).join("")}</div>`+
        (t.dialogue
          ? `<div class="letter">${t.items.map(i=>`<p>${inline(i,ctx,t.bank)}</p>`).join("")}</div>`
          : `<ol class="items">${t.items.map(i=>`<li>${inline(i,ctx,t.bank)}</li>`).join("")}</ol>`);
    case "story":
      return `<p class="sentence">${inline(t.text,ctx)}</p>`;
    case "letter":
      return `<div class="letter"><span class="from">${t.from}</span>${t.items.map(i=>`<p>${inline(i,ctx)}</p>`).join("")}</div>`;
    case "mc":
      return `<ol class="items mc" type="1">${t.items.map(it=>{
        const id=ctx.id(); const opts=shuffle(it.o,id+"x"); ctx.reg({id,kind:"radio",ans:it.o[0]});
        return `<li id="${id}-w"><span class="q">${blank(it.q)}</span><div class="opts" role="radiogroup">${opts.map((o,j)=>`<label class="opt${o===it.o[0]?" is-key":""}"><input type="radio" name="${id}" value="${attr(o)}"><span>${"abc"[j]}) ${o}</span></label>`).join("")}</div></li>`}).join("")}</ol>`;
    case "match":{
      const letters="ABCDEFGHIJ"; const rights=shuffle(t.pairs.map(p=>p[1]),`${test.id}-${ti}-m`);
      const left=t.pairs.map(([l,r])=>{const id=ctx.id(); const L=letters[rights.indexOf(r)]; ctx.reg({id,kind:"select",ans:L});
        return `<li><div class="row"><span>${l}</span><span class="gw" id="${id}-w"><select class="gsel sm" id="${id}" aria-label="Letter"><option value="">–</option>${rights.map((_,j)=>`<option>${letters[j]}</option>`).join("")}</select><span class="fix"></span><span class="key">${L}</span></span></div></li>`}).join("");
      return `<div class="match"><ol class="items mleft">${left}</ol><ul class="mright">${rights.map((r,j)=>`<li><span class="let">${letters[j]}</span><span>${r}</span></li>`).join("")}</ul></div>`;}
    case "transform":
      return `<ol class="items tf">${t.items.map(it=>`<li><span class="orig">${it.q}</span><span class="kw">${it.key}</span><span class="stem">${inline(it.stem,ctx)}</span></li>`).join("")}</ol>`;
    case "error":
      return `<ol class="items tf err">${t.items.map(it=>{const id=ctx.id(); const ans=it.full?it.a.concat([it.full]):it.a; ctx.reg({id,kind:"text",ans});
        return `<li><span class="orig">${it.q}</span><span class="stem">Correction: ${gapHTML(id,it.a.length>6?["CORRECT"]:it.a,false)}</span></li>`}).join("")}</ol>`;
    case "order":
      return `<ol class="items tf">${t.items.map(it=>{const id=ctx.id(); ctx.reg({id,kind:"text",ans:it.a});
        return `<li><div class="words">${it.w.split("/").map(w=>`<span>${w.trim()}</span>`).join("")}</div>${gapHTML(id,it.a,true)}</li>`}).join("")}</ol>`;
    case "speaking":{
      const tid=`${test.id}-t${ti}`; ctx.teacher.push({id:`${tid}-score`,max:t.max});
      return (t.cards?`<div class="rcards">${t.cards.map(c=>`<div class="rcard"><b>${c.t}</b><span>${c.d}</span></div>`).join("")}</div>`:"")+
        `<ol class="prompts">${t.prompts.map(p=>`<li>${p}</li>`).join("")}</ol>
        <div class="help"><span class="bl">Useful language</span><div class="phr">${t.phrases.map(p=>`<span>${p}</span>`).join("")}</div></div>
        <div class="timers" data-timer="${tid}">
          <span class="clock" id="${tid}-clock">${mmss(t.prep||t.talk)}</span>
          ${t.prep?`<button class="btn small" type="button" data-start="${t.prep}" data-label="Подготовка">Подготовка ${mmss(t.prep)}</button>`:""}
          <button class="btn small" type="button" data-start="${t.talk}" data-label="Ответ">Ответ ${mmss(t.talk)}</button>
          <button class="btn small" type="button" data-stop>Стоп</button>
        </div>
        ${teacherMark(tid,t.max,SPEAK_RUBRIC)}`;}
    case "writing":{
      const tid=`${test.id}-t${ti}`; ctx.teacher.push({id:`${tid}-score`,max:t.max});
      return `<div class="help"><span class="bl">Include</span><ul class="prompts">${t.checklist.map(c=>`<li>${c}</li>`).join("")}</ul></div>
        <textarea class="wr" id="${tid}-text" data-min="${t.min}" data-max="${t.maxw}" placeholder="Start writing here…" aria-label="Your blog post"></textarea>
        <div class="wstat" id="${tid}-stat"></div>
        ${teacherMark(tid,t.max,t.rubric)}`;}
  }
  return "";
}
function teacherMark(tid,max,rub){
  return `<div class="tmark"><label for="${tid}-score">Оценка учителя <select id="${tid}-score"><option value="">—</option>${Array.from({length:max+1},(_,i)=>`<option value="${i}">${i}</option>`).join("")}</select> / ${max}</label><span class="rub">${rub}</span></div>`;
}

function renderTask(test,t,ti){
  const ctx=makeCtx(test,ti);
  const inner=body(t,ctx,test,ti);
  const autoN=ctx.auto.length, tMax=ctx.teacher.reduce((s,x)=>s+x.max,0);
  const pts=autoN?`${autoN} pts`:`${tMax} pts · учитель`;
  CURRENT.regs[ti]={auto:ctx.auto,teacher:ctx.teacher,topics:t.topics};
  const pic=t.pic?`<figure class="pic">${SCENES[t.pic]()}</figure>`:"";
  const box=t.box?`<div class="box"><span class="bl">Verbs</span>${t.box.map(b=>`<span>${b}</span>`).join("")}</div>`:"";
  return `<section class="task" id="${test.id}-task-${ti+1}">
    <div class="task-h"><span class="tno">${String(ti+1).padStart(2,"0")}</span>
      <div class="hd"><h3 class="task-title">${t.title}</h3><div class="chips">${t.topics.map(chip).join("")}</div></div>
      <span class="pts" id="${test.id}-pts-${ti}">${pts}</span></div>
    <p class="instr">${t.instr}</p>
    ${t.table||""}${pic}${box}${inner}
  </section>`;
}

function totals(test){
  let a=0,tm=0;
  test.tasks.forEach((t,ti)=>{const c=makeCtx(test,ti);body(t,c,test,ti);a+=c.auto.length;tm+=c.teacher.reduce((s,x)=>s+x.max,0)});
  return {auto:a,teacher:tm};
}

function renderTabs(active){
  $("#tabs").innerHTML=TESTS.map(t=>`<a class="tab" href="#${t.hash}"${active===t.id?' aria-current="page"':""}>${t.name} · ${t.level}</a>`).join("");
}

function renderHome(){
  CURRENT=null; renderTabs(null);
  const order=["money","comp","adjprep","verbprep","simple","cont","perf","perfcont","mixed","speak","write"];
  const tot=TESTS.map(totals);
  $("#main").innerHTML=`
  <div class="wrap">
    <section class="hero">
      <p class="kicker">Проверочная работа · English B1 / B1+</p>
      <h1>Money, <span class="hl">comparisons</span> &amp; tenses</h1>
      <p class="lead">Три варианта: два для уровня B1 и один для B1+. В каждом от 12 заданий разного формата: пропуски, выбор ответа, сопоставление, трансформации, поиск ошибок, описание картинок, устная часть, а в B1+ ещё и письменное задание.</p>
    </section>
    <div class="cards">
      ${TESTS.map((t,i)=>`<a class="vcard" href="#${t.hash}">
        <div class="lv"><span class="big">${t.level}</span><span class="vn">${t.name}</span></div>
        <p class="note">${t.sub}</p>
        <div class="meta"><span>${t.tasks.length} заданий</span><span>${tot[i].auto+tot[i].teacher} баллов</span><span>${t.minutes} мин</span></div>
        <span class="go">Открыть вариант →</span></a>`).join("")}
    </div>
    <section class="section">
      <h2>Какие задания проверяют каждую тему</h2>
      <div class="tablewrap"><table class="cov">
        <thead><tr><th>Тема</th>${TESTS.map(t=>`<th>${t.name} · ${t.level}</th>`).join("")}</tr></thead>
        <tbody>${order.map(k=>`<tr><td>${chip(k)}</td>${TESTS.map(t=>{const n=t.tasks.map((x,i)=>x.topics.includes(k)?i+1:0).filter(Boolean);return `<td class="n">${n.length?"№ "+n.join(", "):"—"}</td>`}).join("")}</tr>`).join("")}</tbody>
      </table></div>
    </section>
    <section class="section">
      <h2>Как проводить</h2>
      <ul class="how">
        <li><b>Ученик</b><span>Открывает свой вариант, пишет имя и выполняет задания. Ответы сохраняются в этом браузере, даже если закрыть вкладку.</span></li>
        <li><b>Автопроверка</b><span>Кнопка «Проверить» внизу отмечает ответы зелёным и красным, показывает правильный вариант и считает баллы по темам.</span></li>
        <li><b>Устная часть</b><span>Говорение и письмо оценивает учитель по критериям под заданием. В заданиях есть таймеры на подготовку и ответ.</span></li>
        <li><b>Режим учителя</b><span>Переключатель вверху показывает ключи прямо в заданиях. Удобно для разбора работы на уроке.</span></li>
      </ul>
    </section>
    <p class="foot">Сокращённые формы (I've, isn't, won't) засчитываются наравне с полными. Регистр и знаки препинания не важны.</p>
  </div>`;
}

function renderTest(test){
  stopAllTimers();
  CURRENT={test,regs:[]}; renderTabs(test.id);
  const tasksHTML=test.tasks.map((t,ti)=>renderTask(test,t,ti)).join("");
  const tot=CURRENT.regs.reduce((s,r)=>({a:s.a+r.auto.length,t:s.t+r.teacher.reduce((x,y)=>x+y.max,0)}),{a:0,t:0});
  $("#main").innerHTML=`
  <div class="wrap">
    <div class="vhead">
      <div class="ttl"><p class="kicker">${test.level} · ${test.name} · ${test.tasks.length} заданий · ${tot.a+tot.t} баллов</p>
        <h1>${test.name} <span class="hl">${test.level}</span></h1><p class="sub">${test.sub}</p></div>
      <div class="stud">
        <label class="field" for="${test.id}-student">Имя ученика<input id="${test.id}-student" type="text" placeholder="Name, class" autocomplete="off"></label>
        <div class="ttimer" data-timer="${test.id}-whole"><span class="clock" id="${test.id}-whole-clock">${mmss(test.minutes*60)}</span><button class="btn small" type="button" data-start="${test.minutes*60}" data-label="Таймер">Старт</button><button class="btn small" type="button" data-stop>Стоп</button></div>
      </div>
    </div>
    <div class="layout">
      <nav class="toc" aria-label="Задания"><ol>${test.tasks.map((t,ti)=>`<li><a href="#${test.hash}" data-jump="${test.id}-task-${ti+1}"><span class="nn">${String(ti+1).padStart(2,"0")}</span><span class="tt">${t.title.replace(/^(Speaking|Writing): /,"$1 · ")}</span><span class="ns" id="${test.id}-ns-${ti}"></span></a></li>`).join("")}</ol></nav>
      <div class="tasks">${tasksHTML}<section class="result" id="result" hidden></section></div>
    </div>
  </div>
  <div class="bar"><div class="wrap">
    <button class="btn primary" type="button" id="check">Проверить ответы</button>
    <button class="btn" type="button" id="reset">Очистить</button>
    <span class="score" id="score">Автопроверка: ${tot.a} · Учитель: ${tot.t}</span>
  </div></div>`;
  restore(test); updateWriting(); window.scrollTo(0,0);
}

/* ---------- state ---------- */
function fields(){return $$("#main input, #main select, #main textarea")}
function save(){
  if(!CURRENT)return; const vals={};
  fields().forEach(el=>{if(el.type==="radio"){if(el.checked)vals[el.name]=el.value}else if(el.id)vals[el.id]=el.value});
  store.set("mtt-"+CURRENT.test.id,vals);
}
function restore(test){
  const vals=store.get("mtt-"+test.id)||{};
  for(const [k,v] of Object.entries(vals)){
    const el=document.getElementById(k);
    if(el&&el.type!=="radio"){el.value=v}else{$$(`input[type=radio]`).forEach(r=>{if(r.name===k&&r.value===v)r.checked=true})}
  }
}
function val(r){if(r.kind==="radio"){const c=$$(`input[type=radio]`).find(x=>x.name===r.id&&x.checked);return c?c.value:""}const el=document.getElementById(r.id);return el?el.value:""}
function isOk(r,v){if(!String(v).trim())return false;if(r.kind==="text")return r.ans.some(a=>norm(a)===norm(v));return v===r.ans}

function check(){
  const {test,regs}=CURRENT; let A=0,AG=0,T=0,TG=0,TS=0,tMissing=0; const topic={};
  regs.forEach((r,ti)=>{
    let g=0;
    r.auto.forEach(x=>{
      const v=val(x), ok=isOk(x,v); if(ok)g++;
      const w=document.getElementById(x.id+"-w"); if(!w)return;
      if(x.kind==="radio"){
        $$(".opt",w).forEach(o=>{const inp=$("input",o);o.classList.toggle("right",inp.value===x.ans);o.classList.toggle("wrong",inp.checked&&inp.value!==x.ans)});
      }else{
        w.classList.toggle("ok",ok); w.classList.toggle("bad",!ok);
        $(".fix",w).textContent=ok?"":"→ "+(x.ans[0]===OK_WORDS[0]?"CORRECT":(Array.isArray(x.ans)?x.ans[0]:x.ans));
      }
    });
    let tg=0,tm=0;
    r.teacher.forEach(x=>{tm+=x.max;const v=document.getElementById(x.id)?.value;if(v===""||v==null)tMissing++;else tg+=+v});
    A+=r.auto.length;AG+=g;T+=tm;TG+=tg;
    const n=r.auto.length, ns=document.getElementById(`${test.id}-ns-${ti}`), pe=document.getElementById(`${test.id}-pts-${ti}`);
    if(n){ns.textContent=`${g}/${n}`;ns.className="ns "+(g/n>=.7?"good":g/n<.5?"weak":"");pe.textContent=`${g} / ${n} pts`;pe.classList.add("got")}
    else{ns.textContent=tm&&document.getElementById(r.teacher[0].id).value!==""?`${tg}/${tm}`:"—";ns.className="ns";}
    const scored=r.teacher.filter(x=>document.getElementById(x.id).value!=="");
    const sm=scored.reduce((s,x)=>s+x.max,0); TS+=sm;
    r.topics.forEach(k=>{
      const oral=k==="speak"||k==="write";
      if(n&&!oral){topic[k]=topic[k]||{g:0,m:0};topic[k].g+=g;topic[k].m+=n}
      if(!n&&oral&&sm){topic[k]=topic[k]||{g:0,m:0};topic[k].g+=tg;topic[k].m+=sm}
    });
  });
  const max=A+TS, got=AG+TG, pc=max?Math.round(got/max*100):0;
  const grade=pc>=86?"5 (отлично)":pc>=70?"4 (хорошо)":pc>=50?"3 (удовл.)":"2 (неудовл.)";
  $("#score").innerHTML=`Автопроверка: <b>${AG}/${A}</b> · Учитель: <b>${TG}/${T}</b> · Итого: <b>${pc}%</b>`;
  const name=$(`#${test.id}-student`).value.trim();
  const res=$("#result"); res.hidden=false;
  res.innerHTML=`<div class="res-top">
      <div><small>Результат${name?" · "+attr(name):""}</small><div class="pc">${pc}%</div></div>
      <div class="grade"><small>Ориентировочная оценка</small><b>${grade}</b></div>
      <div class="res-nums"><span>Автопроверка: ${AG} / ${A}</span><span>Говорение и письмо: ${TG} / ${T}</span><span>Итого: ${got} / ${max}${tMissing?` (без ${tMissing} неоценённых)`:""}</span></div>
    </div>
    ${tMissing?`<p class="note">Устная часть и письмо ещё не оценены учителем: процент посчитан только по оценённым заданиям. Выставьте баллы в заданиях и нажмите «Проверить» ещё раз.</p>`:""}
    <div style="display:grid;gap:10px"><h3 class="task-title">По темам</h3>
    <ul class="tbars">${Object.entries(topic).filter(([,v])=>v.m).map(([k,v])=>{const p=Math.round(v.g/v.m*100);return `<li style="--tc:var(${TOPICS[k].c})"><span>${TOPICS[k].label}</span><span class="track"><span class="fill" style="width:${p}%"></span></span><span class="v">${v.g}/${v.m} · ${p}%</span></li>`}).join("")}</ul></div>`;
  res.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}

let resetArmed=null;
function reset(btn){
  if(!resetArmed){btn.textContent="Точно очистить? Нажмите ещё раз";btn.classList.add("warn");resetArmed=setTimeout(()=>{resetArmed=null;btn.textContent="Очистить";btn.classList.remove("warn")},3500);return}
  clearTimeout(resetArmed);resetArmed=null;
  store.del("mtt-"+CURRENT.test.id); renderTest(CURRENT.test);
}

/* ---------- timers ---------- */
function stopAllTimers(){for(const k in timers){clearInterval(timers[k]);delete timers[k]}}
function startTimer(group,sec){
  const key=group.dataset.timer, clock=$(".clock",group);
  clearInterval(timers[key]); let left=sec; clock.textContent=mmss(left); clock.classList.remove("done");
  timers[key]=setInterval(()=>{left--;clock.textContent=mmss(Math.max(left,0));if(left<=0){clearInterval(timers[key]);delete timers[key];clock.classList.add("done");beep()}},1000);
}

/* ---------- writing helper ---------- */
const MONEY_RE=[/worth every penny/,/impulse (purchase|buy)/,/sav(e|es|ed|ing) up/,/waste of money/,/value for money/,/second thoughts/,/treat(s|ed|ing)? (myself|yourself|himself|herself|ourselves|themselves)/,/splash(es|ed|ing)? out/];
const COMP_RE=[/\bas \w+ as\b/,/\bthe same as\b/,/\bthe (more|less|\w+er)\b[^.!?]*\bthe (more|less|\w+er)\b/];
function updateWriting(){
  $$("textarea.wr").forEach(ta=>{
    const txt=ta.value.toLowerCase(), words=(ta.value.trim().match(/\S+/g)||[]).length;
    const mn=+ta.dataset.min, mx=+ta.dataset.max;
    const m=MONEY_RE.filter(r=>r.test(txt)).length, c=COMP_RE.some(r=>r.test(txt));
    const st=document.getElementById(ta.id.replace("-text","-stat"));
    st.innerHTML=`<span>Слов: <b class="${words>=mn&&words<=mx?"y":""}">${words}</b> / ${mn}–${mx}</span><span>Фраз про деньги: <b class="${m>=3?"y":""}">${m}</b> / 3</span><span>Сравнение: <b class="${c?"y":""}">${c?"есть":"нет"}</b></span>`;
  });
}

/* ---------- events ---------- */
document.addEventListener("input",e=>{
  const w=e.target.closest(".gw"); if(w){w.classList.remove("ok","bad");const f=$(".fix",w);if(f)f.textContent=""}
  if(e.target.matches("textarea.wr"))updateWriting();
  save();
});
document.addEventListener("change",e=>{
  if(e.target.type==="radio"){const li=e.target.closest("li");if(li)$$(".opt",li).forEach(o=>o.classList.remove("right","wrong"))}
  if(e.target.id==="teacher-toggle"){document.body.classList.toggle("teacher",e.target.checked);store.set("mtt-teacher",e.target.checked);return}
  save();
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  const j=e.target.closest("[data-jump]");
  if(j){e.preventDefault();document.getElementById(j.dataset.jump)?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  if(!b)return;
  if(b.id==="check")return check();
  if(b.id==="reset")return reset(b);
  const g=b.closest("[data-timer]");
  if(g&&b.dataset.start){startTimer(g,+b.dataset.start);return}
  if(g&&b.hasAttribute("data-stop")){clearInterval(timers[g.dataset.timer]);delete timers[g.dataset.timer]}
});

function route(){
  const h=location.hash.slice(1); const t=TESTS.find(x=>x.hash===h);
  if(t){if(!CURRENT||CURRENT.test!==t)renderTest(t)}else{stopAllTimers();renderHome();window.scrollTo(0,0)}
}
window.addEventListener("hashchange",route);
if(store.get("mtt-teacher")){$("#teacher-toggle").checked=true;document.body.classList.add("teacher")}
route();
</script>
</body>
