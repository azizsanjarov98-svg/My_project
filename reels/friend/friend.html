<!doctype html>
<html><head><meta charset="utf-8"><title>Друг в Дубае</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:405px;height:720px}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../cartoon/characters.js"></script>
<script>
// =====================================================================
//  «ДЕНЬ 1. СНОВА» — 2D cartoon, 9:16, 30 fps, ~45 s. No dialogue.
// =====================================================================
const W = 1080, H = 1920, FPS = 30, DUR = 38.4;
const out = document.getElementById('c'), octx = out.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
let g = buf.getContext('2d');
const F = '"Inter Display", Inter, sans-serif', EMO = '"Noto Color Emoji"';
const { seryoga, barkhan, shade } = CHAR;
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eOut = x => 1 - Math.pow(1 - x, 3), eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function txt(s, x, y, size, col, o = {}) { g.save(); g.font = `${o.w ?? 900} ${size}px ${o.fam ?? F}`; g.fillStyle = col; g.textAlign = o.al ?? 'center'; g.textBaseline = 'middle'; if (o.track) g.letterSpacing = o.track + 'px'; if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = o.gr ?? 30; } g.fillText(s, x, y); g.restore(); }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function lg(x0, y0, x1, y1, stops) { const q = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => q.addColorStop(o, c)); return q; }

// light presets
const DAY = { dir: -1, rim: 'rgba(255,240,205,.9)', shadow: 'rgba(80,25,70,.30)', ground: 'rgba(80,25,70,.15)', cel: 'rgba(110,30,70,.20)' };
const ROOM = { dir: -1, rim: 'rgba(255,225,170,.85)', shadow: 'rgba(70,25,60,.32)', ground: 'rgba(70,25,60,.16)', cel: 'rgba(100,30,60,.2)' };
const SUNSET = { dir: -1, rim: 'rgba(255,170,90,.95)', shadow: 'rgba(90,20,80,.38)', ground: 'rgba(90,20,80,.2)', cel: 'rgba(120,30,80,.26)' };
const NIGHT = { dir: 1, rim: 'rgba(150,200,255,.9)', shadow: 'rgba(5,10,45,.55)', ground: 'rgba(5,10,45,.35)', cel: 'rgba(10,20,70,.35)', cast: 'rgba(0,0,25,.5)' };
const PHONE = { dir: 1, rim: 'rgba(255,200,120,.95)', shadow: 'rgba(10,10,40,.55)', ground: 'rgba(10,10,40,.3)', cel: 'rgba(20,20,70,.3)' };

// ---------------------------------------------------------------- props
function alarmClock(x, y, s, t, ring, squash = 0, hands = [7, 0]) {
  g.save(); g.translate(x, y); g.scale(s * (1 + squash * .15), s * (1 - squash * .22));
  if (ring) g.rotate(Math.sin(t * 70) * .07);
  // legs
  g.fillStyle = '#7a1d24'; [-1, 1].forEach(d => { g.save(); g.translate(d * 70, 100); g.rotate(d * .4); rr(-10, 0, 20, 45, 8); g.fill(); g.restore(); });
  // bells + hammer
  [-1, 1].forEach(d => { g.save(); g.translate(d * 70, -95); g.rotate(d * .5);
    g.fillStyle = lg(-50, 0, 50, 0, [[0, '#ffe17a'], [1, '#c7911c']]); g.beginPath(); g.arc(0, 0, 50, Math.PI, 0); g.closePath(); g.fill();
    g.strokeStyle = '#8a5b10'; g.lineWidth = 5; g.stroke(); g.restore(); });
  g.fillStyle = '#5a3b10'; g.fillRect(-6, -150, 12, 40); if (ring) { g.save(); g.translate(0, -150); g.rotate(Math.sin(t * 90) * .6); g.fillRect(-4, -36, 8, 36); g.beginPath(); g.arc(0, -36, 10, 0, TAU); g.fill(); g.restore(); }
  // body
  g.fillStyle = lg(-120, -120, 120, 120, [[0, '#ff5a5f'], [1, '#b8202e']]); g.beginPath(); g.arc(0, 0, 120, 0, TAU); g.fill();
  g.strokeStyle = '#6e121a'; g.lineWidth = 7; g.stroke();
  g.fillStyle = '#fff8ea'; g.beginPath(); g.arc(0, 0, 92, 0, TAU); g.fill(); g.strokeStyle = '#d9c7a5'; g.lineWidth = 4; g.stroke();
  g.fillStyle = '#3a2a2a'; for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; g.beginPath(); g.arc(Math.sin(a) * 74, -Math.cos(a) * 74, i % 3 ? 4 : 7, 0, TAU); g.fill(); }
  const hA = (hands[0] % 12 + hands[1] / 60) / 12 * TAU, mA = hands[1] / 60 * TAU;
  g.strokeStyle = '#2a1d1d'; g.lineCap = 'round'; g.lineWidth = 9; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.sin(hA) * 45, -Math.cos(hA) * 45); g.stroke();
  g.lineWidth = 6; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.sin(mA) * 68, -Math.cos(mA) * 68); g.stroke();
  g.fillStyle = '#e8443a'; g.beginPath(); g.arc(0, 0, 9, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(-48, -50, 26, 14, -.7, 0, TAU); g.fill();
  g.restore();
  if (ring) { // vibration lines
    g.save(); g.strokeStyle = 'rgba(60,20,30,.75)'; g.lineWidth = 7; g.lineCap = 'round';
    [-1, 1].forEach(d => { for (let k = 0; k < 3; k++) { const r = 180 * s + k * 34 * s + Math.sin(t * 40) * 6; g.beginPath(); g.arc(x, y - 30 * s, r, d > 0 ? -.55 : Math.PI - .1, d > 0 ? .1 : Math.PI + .55); g.stroke(); } });
    g.restore();
  }
}
function stamp(text, x, y, t, t0, col = '#e8443a', size = 120, rot = -.12) {
  const p = prog(t, t0, t0 + .22); if (p <= 0) return;
  const s = lerp(2.4, 1, eOut(p));
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); g.globalAlpha = clamp(p * 2.5);
  g.font = `900 ${size}px ${F}`; const w = g.measureText(text).width + 70;
  g.strokeStyle = col; g.lineWidth = 12; rr(-w / 2, -size * .72, w, size * 1.44, 24); g.stroke();
  txt(text, 0, 6, size, col);
  g.globalCompositeOperation = 'destination-out'; // grungy ink gaps
  for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(0,0,0,${.5 + rnd(i) * .5})`; g.beginPath(); g.arc(-w / 2 + rnd(i + 3) * w, -size * .7 + rnd(i + 7) * size * 1.4, 2 + rnd(i + 9) * 6, 0, TAU); g.fill(); }
  g.restore();
}
function rewind(t, t0, t1) { // VHS rewind glitch overlay
  if (t < t0 || t > t1) return;
  const p = prog(t, t0, t1);
  g.save(); g.fillStyle = `rgba(10,10,30,${.35})`; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 26; i++) { const y = (rnd(i + Math.floor(t * 30)) * H); g.fillStyle = `rgba(255,255,255,${.15 + rnd(i * 3) * .3})`; g.fillRect(0, y, W, 2 + rnd(i) * 10); }
  const by = ((t * 2600) % (H + 200)) - 100; g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(0, by, W, 90);
  g.globalCompositeOperation = 'lighter'; g.fillStyle = 'rgba(255,0,80,.12)'; g.fillRect(14, 0, W, H); g.fillStyle = 'rgba(0,200,255,.12)'; g.fillRect(-14, 0, W, H);
  g.restore();
  txt('◀◀', 150, 180, 90, '#fff', { glow: 'rgba(0,0,0,.6)' }); txt('REW', 290, 182, 64, '#fff', { w: 800 });
}
function burj(cx, base, h, col) {
  g.fillStyle = col; g.beginPath();
  const tiers = [[60, 0], [48, .22], [38, .42], [28, .6], [18, .76], [10, .88], [4, .96]];
  g.moveTo(cx - 70 * h / 820, base);
  tiers.forEach(([w, f]) => g.lineTo(cx - w * h / 820, base - h * f));
  g.lineTo(cx - 1.5, base - h * 1.08); g.lineTo(cx + 1.5, base - h * 1.08);
  [...tiers].reverse().forEach(([w, f]) => g.lineTo(cx + w * h / 820, base - h * f));
  g.lineTo(cx + 70 * h / 820, base); g.closePath(); g.fill();
}
function skyline(base, col, seed = 1, sc = 1) {
  g.fillStyle = col; let x = -20; let i = 0;
  while (x < W + 40) { const w = (50 + rnd(x + seed) * 80) * sc, h = (100 + rnd(x + seed + 1) * 260) * sc; g.fillRect(x, base - h, w, h + 5); x += w + 8 * sc; i++; }
}
function palmPot(x, y, s, t) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = '#b5643c'; g.beginPath(); g.moveTo(-60, 0); g.lineTo(60, 0); g.lineTo(45, 110); g.lineTo(-45, 110); g.closePath(); g.fill();
  g.strokeStyle = '#6b8f3a'; g.lineWidth = 14; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(10, -120, -5, -230); g.stroke();
  g.fillStyle = '#3f8f4a';
  for (let i = 0; i < 7; i++) { g.save(); g.translate(-5, -230); g.rotate(-Math.PI / 2 + (i - 3) * .5 + Math.sin(t * 1.4 + i) * .04);
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(80, -40, 170, 20); g.quadraticCurveTo(80, 0, 0, 0); g.fill(); g.restore(); }
  g.restore();
}
function phoneDevice(x, y, s, rot, screen) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  g.fillStyle = '#16182a'; rr(-170, -340, 340, 680, 46); g.fill(); g.strokeStyle = '#3a3f60'; g.lineWidth = 6; g.stroke();
  g.save(); rr(-152, -322, 304, 644, 34); g.clip(); screen(); g.restore();
  g.fillStyle = '#16182a'; rr(-50, -318, 100, 22, 11); g.fill();
  g.restore();
}
function mitten(x, y, s, rot = 0, L = DAY) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  CHAR.body(g, () => { g.beginPath(); g.ellipse(0, 0, 40, 46, 0, 0, TAU); }, '#f2c29a', L, { bb: [-40, -46, 80, 92], cel: false });
  CHAR.body(g, () => { g.beginPath(); g.ellipse(-36, -8, 15, 24, -.5, 0, TAU); }, '#f2c29a', L, { bb: [-50, -32, 30, 48], cel: false, lw: 4 });
  g.restore();
}

// ---------------------------------------------------------------- shared sets
function bedroomWall(t, warm = 1) {
  g.fillStyle = lg(0, 0, 0, H, [[0, '#f6d9b2'], [1, '#e9bf8f']]); g.fillRect(0, 0, W, H);
  // wallpaper stripes
  g.fillStyle = 'rgba(200,120,80,.08)'; for (let x = 0; x < W; x += 90) g.fillRect(x, 0, 40, H);
  // window light patch
  g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = `rgba(255,220,150,${.25 * warm})`;
  g.beginPath(); g.moveTo(120, 180); g.lineTo(560, 140); g.lineTo(700, 820); g.lineTo(200, 900); g.closePath(); g.fill(); g.restore();
}
function nightstand() {
  g.fillStyle = lg(0, 1240, 0, H, [[0, '#9b5a35'], [1, '#5e3220']]); g.fillRect(0, 1240, W, H - 1240);
  g.fillStyle = '#b8714a'; g.fillRect(0, 1225, W, 30);
  g.fillStyle = 'rgba(0,0,0,.15)'; for (let i = 0; i < 6; i++) g.fillRect(0, 1300 + i * 110, W, 3);
}
function alarmShot(t, ringFrom, slapAt, opts = {}) { // the recurring close-up
  bedroomWall(t);
  // lamp silhouette + book
  g.fillStyle = '#2d6f6a'; rr(780, 1030, 170, 200, 18); g.fill(); g.fillStyle = '#f7e2b5'; g.beginPath(); g.moveTo(760, 1040); g.lineTo(970, 1040); g.lineTo(920, 870); g.lineTo(810, 870); g.closePath(); g.fill();
  g.fillStyle = '#c2453d'; rr(110, 1170, 260, 56, 8); g.fill(); g.fillStyle = '#e9d29b'; rr(130, 1130, 230, 44, 8); g.fill();
  nightstand();
  const ring = t >= ringFrom && t < slapAt;
  const sq = slapAt ? Math.exp(-Math.max(0, t - slapAt) * 14) * (t >= slapAt ? 1 : 0) : 0;
  alarmClock(540, 1060, 1.5, t, ring, sq, opts.hands || [7, 0]);
  if (slapAt && t > slapAt - .25 && t < slapAt + .55) { // hand comes down
    const p = t < slapAt ? eIn(prog(t, slapAt - .25, slapAt)) : 1 - eOut(prog(t, slapAt + .15, slapAt + .55));
    mitten(560, lerp(-150, 760, p), 2.4, .2, ROOM);
    if (t >= slapAt && t < slapAt + .15) { g.save(); g.strokeStyle = 'rgba(80,30,30,.8)'; g.lineWidth = 10; g.lineCap = 'round'; for (let k = 0; k < 6; k++) { const a = -Math.PI + k * .6 - .3; g.beginPath(); g.moveTo(540 + Math.cos(a) * 260, 900 + Math.sin(a) * 150); g.lineTo(540 + Math.cos(a) * 340, 900 + Math.sin(a) * 200); g.stroke(); } g.restore(); }
  }
}
function bedroomWide(t, opts = {}) {
  g.fillStyle = lg(0, 0, 0, H, [[0, '#f3d2a7'], [1, '#e0aa78']]); g.fillRect(0, 0, W, H);
  // window with Burj view
  const wx = 120, wy = 260, ww = 520, wh = 700;
  g.save(); rr(wx, wy, ww, wh, 16); g.clip();
  g.fillStyle = lg(0, wy, 0, wy + wh, [[0, opts.night ? '#0d1838' : '#7cc7ff'], [1, opts.night ? '#2a2f5a' : '#ffe1b0']]); g.fillRect(wx, wy, ww, wh);
  skyline(wy + wh, opts.night ? '#18204a' : '#a8c4dc', 3, .7); burj(wx + 330, wy + wh, 600, opts.night ? '#141a3e' : '#8fb0cc');
  if (opts.camel) { barkhan(g, { x: wx + 120, y: wy + wh - 10, s: .12, face: 1, chew: t * 6, lid: .55 }, DAY); }
  g.restore();
  g.strokeStyle = '#fff4e2'; g.lineWidth = 22; rr(wx, wy, ww, wh, 16); g.stroke(); g.lineWidth = 12; g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh); g.stroke();
  // curtains
  g.fillStyle = '#d0564d'; [wx - 70, wx + ww - 10].forEach(cx => { g.beginPath(); g.moveTo(cx, wy - 60); g.quadraticCurveTo(cx + 40, wy + 400, cx + 10, wy + wh + 80); g.lineTo(cx + 80, wy + wh + 80); g.quadraticCurveTo(cx + 110, wy + 400, cx + 80, wy - 60); g.closePath(); g.fill(); });
  // door
  g.fillStyle = '#a7633f'; rr(780, 560, 230, 760, 10); g.fill(); g.fillStyle = '#ffd34d'; g.beginPath(); g.arc(810, 950, 14, 0, TAU); g.fill();
  // floor
  g.fillStyle = lg(0, 1320, 0, H, [[0, '#b97a4f'], [1, '#7c4a2e']]); g.fillRect(0, 1320, W, H);
  g.fillStyle = 'rgba(255,255,255,.05)'; for (let i = 0; i < 9; i++) g.fillRect(i * 130, 1320, 4, H);
  // bed
  g.fillStyle = '#efe6d8'; rr(-40, 1060, 560, 140, 30); g.fill(); // pillow area
  g.fillStyle = '#7a4a2e'; rr(-60, 1000, 40, 420, 10); g.fill();
}

const SHOTS = [];
const shot = (t0, t1, fn, look = 'day') => SHOTS.push({ t0, t1, fn, look });
// =====================================================================
//  «ДРУГ В ДУБАЕ» — wordless comedy. Seryoga only THINKS of a place,
//  Barkhan is already there with the ticket in his mouth. 4 rounds + finale.
// =====================================================================
// ---------- camera, layers, life
const layer = document.createElement('canvas'); layer.width = W; layer.height = H; const lctx = layer.getContext('2d');
function blurred(px, fn) { const prev = g; g = lctx; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.save(); fn(); g.restore(); g = prev; g.save(); if (px > .3) g.filter = `blur(${px}px)`; g.drawImage(layer, 0, 0); g.restore(); }
function handheld(t, amp = 1, zoom = 1, cx = W / 2, cy = H / 2) {
  const dx = (Math.sin(t * .9) * 6 + Math.sin(t * 2.3 + 1) * 2.5) * amp, dy = (Math.sin(t * .7 + 2) * 5 + Math.sin(t * 2.9) * 2) * amp, r = Math.sin(t * .6 + 4) * .003 * amp;
  g.translate(cx + dx, cy + dy); g.rotate(r); g.scale(zoom, zoom); g.translate(-cx, -cy);
}
const push = (t, t0, t1, z0, z1) => lerp(z0, z1, eIO(prog(t, t0, t1)));
const blink = (t, seed = 0) => { const p = (t + seed * 1.7) % 3.3; return p < .12 ? .08 : 1; };
const breath = (t, seed = 0) => Math.sin(t * 2.1 + seed) * 4;
function squash(x, y, sx, sy, fn) { g.save(); g.translate(x, y); g.scale(sx, sy); g.translate(-x, -y); fn(); g.restore(); }
const hop = (t, t0, d = .55) => { const p = prog(t, t0, t0 + d); if (p <= 0 || p >= 1) return { y: 0, sx: 1, sy: 1 };
  if (p < .18) { const q = p / .18; return { y: 0, sx: 1 + .12 * Math.sin(q * Math.PI), sy: 1 - .14 * Math.sin(q * Math.PI) }; }
  if (p < .82) { const q = (p - .18) / .64; return { y: -Math.sin(q * Math.PI) * 150, sx: .94, sy: 1.08 }; }
  const q = (p - .82) / .18; return { y: 0, sx: 1 + .1 * Math.sin(q * Math.PI), sy: 1 - .12 * Math.sin(q * Math.PI) }; };
// ---------- brand emblem (exact artwork + «@»)
const LOGO = new Image(); LOGO.src = 'assets/logo_aziz.png';
function logo(x, y, size, alpha = 1) { if (!LOGO.complete || !LOGO.naturalWidth) return; const h = size * 2.43, w = h * LOGO.naturalWidth / LOGO.naturalHeight; g.save(); g.globalAlpha *= alpha * .61; g.drawImage(LOGO, x - w / 2, y - h * .695, w, h); g.restore(); }

// ---------- props
const TK = {
  aqua: ['#12a5e0', '🌊', 'АКВАПАРК'], yacht: ['#2563eb', '🛥️', 'ЯХТА'], burj: ['#ff7b39', '🏙️', 'БУРДЖ-ХАЛИФА'],
  ferrari: ['#e8261c', '🏎️', 'FERRARI WORLD'], safari: ['#d97a2b', '🐪', 'САФАРИ'],
};
function ticket(key, x = 0, y = 0, s = 1, rot = 0, tear = 0) {
  const [col, em, label] = TK[key];
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  const half = (side) => { g.save(); if (tear) g.translate(side * tear * 60, tear * tear * 200 * (side > 0 ? 1 : .6)); if (tear) g.rotate(side * tear * .6);
    g.beginPath(); if (side < 0) { g.moveTo(-170, -80); g.lineTo(70, -80); g.lineTo(70, 80); g.lineTo(-170, 80); g.lineTo(-170, 20); g.arc(-170, 0, 20, Math.PI / 2, -Math.PI / 2, true); }
    else { g.moveTo(70, -80); g.lineTo(170, -80); g.lineTo(170, -20); g.arc(170, 0, 20, -Math.PI / 2, Math.PI / 2, true); g.lineTo(170, 80); g.lineTo(70, 80); }
    g.closePath(); g.fillStyle = col; g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 18; g.shadowOffsetY = 6; g.fill(); g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 3; g.stroke(); g.restore(); };
  half(-1); half(1);
  if (!tear) {
    g.setLineDash([9, 9]); g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 4; g.beginPath(); g.moveTo(70, -72); g.lineTo(70, 72); g.stroke(); g.setLineDash([]);
    g.save(); g.font = `70px ${EMO}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000'; g.fillText(em, -112, 4); g.restore();
    let fs = 30; g.font = `900 ${fs}px ${F}`; while (g.measureText(label).width > 150 && fs > 16) { fs -= 1; g.font = `900 ${fs}px ${F}`; }
    txt(label, -10, -14, fs, '#fff'); txt('ВХОД · 1', -10, 26, 20, 'rgba(255,255,255,.85)', { w: 700, track: 3 });
    g.save(); g.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0, yy = -60; yy < 60; i++) { const bw = 2 + (rnd(i * 3.7 + label.length) * 5 | 0); g.fillRect(100 + (i % 2) * 2, yy, 40, bw); yy += bw + 4; } g.restore();
  }
  g.restore();
}
function thought(hx, hy, bx, by, t, t0, t1, emoji, size = 1) { // cloud bubble growing out of the head
  const p = prog(t, t0, t0 + .45), q = t1 ? prog(t, t1, t1 + .18) : 0; if (p <= 0 || q >= 1) return;
  g.save(); g.globalAlpha = 1 - q;
  [[.18, 14], [.38, 22], [.6, 32]].forEach(([k, r], i) => { const pp = prog(p, i * .15, i * .15 + .3); if (pp <= 0) return; g.fillStyle = '#fff'; g.strokeStyle = '#2a2140'; g.lineWidth = 4; g.beginPath(); g.arc(lerp(hx, bx, k), lerp(hy, by, k) + Math.sin(t * 3 + i) * 4, r * back(pp), 0, TAU); g.fill(); g.stroke(); });
  const pb = back(prog(p, .45, 1), 2) * (1 + q * .6) * size; if (pb > 0) {
    g.save(); g.translate(bx, by + Math.sin(t * 2.5) * 6); g.scale(pb, pb);
    g.fillStyle = '#fff'; g.strokeStyle = '#2a2140'; g.lineWidth = 6;
    const blobs = [[-110, 0, 80], [-40, -60, 90], [60, -55, 85], [120, 10, 75], [50, 60, 80], [-50, 55, 78]];

// ---- finale · sunset dune, two friends
shot(FIN, END, (l, t) => {

const NOISE = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const d = x.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; })();
