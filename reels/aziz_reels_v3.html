<!doctype html>
<html><head><meta charset="utf-8"><title>Билеты у Азиза v3</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:405px;height:720px}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// =====================================================================
//  Reels 9:16 · «Билеты у Азиза» · @AzizDubaiGuide
//  Tempo 120 BPM → one beat = 0.5 s. Every cut lands on a beat.
// =====================================================================
const W = 1080, H = 1920, FPS = 30, DUR = 36.688;
const out = document.getElementById('c'), octx = out.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
let ctx = buf.getContext('2d');
const SANS = '"Inter Display", Inter, sans-serif';
const EMOJI = '"Noto Color Emoji"';
const HANDLE = '@AzizDubaiGuide';

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eOut5 = x => 1 - Math.pow(1 - x, 5);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const expoOut = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const expoIn = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const back = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const elastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * 2.0944) + 1;
const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const BEAT = .5;

// ---------- palette ----------
const C = {
  night0: '#070a1f', night1: '#14103a', night2: '#2a0f4a',
  gold: '#ffc94a', gold2: '#ff9b3d', pink: '#ff3d8b', cyan: '#35e0ff', violet: '#8a5bff',
  white: '#ffffff', ink: '#0d1330',
};

// ---------- logo (real file if present, vector fallback) ----------
const avatar = new Image(); let avatarOK = false; avatar.onload = () => { avatarOK = true; }; avatar.src = 'assets/aziz_avatar.jpg';
const logoImg = new Image(); let logoOK = false;
logoImg.onload = () => { logoOK = true; }; logoImg.src = 'assets/logo.png';

// ---------- drawing helpers ----------
function font(size, weight = 900, fam = SANS) { ctx.font = `${weight} ${size}px ${fam}`; }
function txt(s, x, y, size, fill, o = {}) {
  ctx.save();
  font(size, o.w ?? 900, o.fam ?? SANS);
  ctx.textAlign = o.align ?? 'center'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = (o.track ?? 0) + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowR ?? 40; }
  if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = fill; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  else { ctx.fillStyle = fill; ctx.fillText(s, x, y); }
  ctx.restore();
}
function measure(s, size, w = 900, track = 0) { ctx.save(); font(size, w); ctx.letterSpacing = track + 'px'; const m = ctx.measureText(s).width; ctx.restore(); return m; }
function goldGrad(y0, y1) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, '#fff3c2'); g.addColorStop(.45, C.gold); g.addColorStop(1, C.gold2); return g; }
function hotGrad(x0, x1) { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, C.pink); g.addColorStop(.5, C.gold2); g.addColorStop(1, C.gold); return g; }
// mask-reveal line: text slides up from behind an invisible edge
function reveal(s, x, y, size, fill, t, t0, d = .45, o = {}) {
  const p = prog(t, t0, t0 + d); if (p <= 0) return;
  const e = expoOut(p);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, y - size * .72, W, size * 1.44); ctx.clip();
  ctx.translate(0, (1 - e) * size * 1.3);
  txt(s, x, y, size, fill, o);
  ctx.restore();
}
// mask-exit: slide everything up and out
function exitMask(t, t0, d = .3) { return eIn(prog(t, t0, t0 + d)); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function emoji(e, x, y, size) { ctx.save(); ctx.fillStyle = '#000'; ctx.globalAlpha = ctx.globalAlpha; ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); ctx.restore(); }
function glass(x, y, w, h, r, a = .1) {
  ctx.save(); rr(x, y, w, h, r);
  const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, `rgba(255,255,255,${a + .08})`); g.addColorStop(1, `rgba(255,255,255,${a * .4})`);
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.stroke(); ctx.restore();
}
function check(x, y, s, col, p) {
  if (p <= 0) return; const e = back(clamp(p));
  ctx.save(); ctx.translate(x, y); ctx.scale(e, e);
  ctx.beginPath(); ctx.arc(0, 0, s, 0, 7); ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 30; ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#fff'; ctx.lineWidth = s * .26; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const q = clamp(p * 1.6 - .3);
  ctx.beginPath(); ctx.moveTo(-s * .42, 0); ctx.lineTo(-s * .12, s * .3);
  if (q > .4) ctx.lineTo(lerp(-s * .12, s * .45, (q - .4) / .6), lerp(s * .3, -s * .32, (q - .4) / .6));
  ctx.stroke(); ctx.restore();
}

// ---------- background world ----------
const SKY = (() => { // deterministic Dubai skyline, Burj Khalifa in the middle
  const b = []; let x = -20;
  while (x < W + 40) { const w = 50 + rnd(x) * 90; b.push({ x, w, h: 160 + rnd(x + 1) * 320, top: rnd(x + 2) }); x += w + 6; }
  return b;
})();
function burj(cx, base, h, col) {
  ctx.fillStyle = col; ctx.beginPath();
  const tiers = [[60, 0], [48, .22], [38, .42], [28, .6], [18, .76], [10, .88], [4, .96]];
  ctx.moveTo(cx - 70, base);
  tiers.forEach(([w, f]) => { ctx.lineTo(cx - w, base - h * f); });
  ctx.lineTo(cx - 1.5, base - h * 1.08); ctx.lineTo(cx + 1.5, base - h * 1.08);
  [...tiers].reverse().forEach(([w, f]) => { ctx.lineTo(cx + w, base - h * f); });
  ctx.lineTo(cx + 70, base); ctx.closePath(); ctx.fill();
}
function skyline(t, base, alpha, lift) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(0, (1 - lift) * 500);
  const col = '#0a0b22';
  SKY.forEach((b, i) => {
    ctx.fillStyle = col; ctx.fillRect(b.x, base - b.h, b.w, b.h + 400);
    if (b.top > .6) { ctx.beginPath(); ctx.moveTo(b.x, base - b.h); ctx.lineTo(b.x + b.w / 2, base - b.h - 50); ctx.lineTo(b.x + b.w, base - b.h); ctx.fill(); }
    for (let wy = base - b.h + 20; wy < base; wy += 28) for (let wx = b.x + 10; wx < b.x + b.w - 10; wx += 20) {
      const k = wx * 7.1 + wy * 3.3; if (rnd(k) > .72) { const fl = .5 + .5 * Math.sin(t * 3 + k); ctx.fillStyle = `rgba(255,${190 + rnd(k + 1) * 50 | 0},120,${.25 + .45 * fl * rnd(k + 2)})`; ctx.fillRect(wx, wy, 8, 12); }
    }
  });
  burj(W / 2 + 40, base, 820, col);
  // aviation light on spire
  const bl = .5 + .5 * Math.sin(t * 6); ctx.beginPath(); ctx.arc(W / 2 + 40, base - 820 * 1.08, 6 + bl * 4, 0, 7); ctx.fillStyle = `rgba(255,60,90,${.5 + bl * .5})`; ctx.shadowColor = '#ff3d5a'; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0;
  // water reflection
  const g = ctx.createLinearGradient(0, base, 0, base + 300); g.addColorStop(0, 'rgba(255,170,90,.25)'); g.addColorStop(1, 'rgba(10,10,40,0)');
  ctx.fillStyle = g; ctx.fillRect(0, base, W, 300);
  for (let i = 0; i < 14; i++) { const y = base + 20 + i * 18, a = .12 * (1 - i / 14); ctx.fillStyle = `rgba(255,210,140,${a})`; const off = Math.sin(t * 2 + i) * 30; ctx.fillRect(W / 2 - 160 + off + i * 6, y, 320 - i * 12, 3); }
  ctx.restore();
}
function aurora(t, energy = 1, hue = 0) {
  const blobs = [
    [C.violet, .25, .3, 700], [C.pink, .8, .25, 600], [C.cyan, .7, .75, 650], [C.gold2, .2, .8, 550],
  ];
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  blobs.forEach(([col, bx, by, r], i) => {
    const x = W * (bx + .12 * Math.sin(t * .5 + i * 2)), y = H * (by + .08 * Math.cos(t * .4 + i));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * (1 + .1 * Math.sin(t + i)));
    g.addColorStop(0, col + '55'); g.addColorStop(1, col + '00');
    ctx.globalAlpha = .55 * energy; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });
  ctx.restore();
}
function particles(t, n = 50, col = '255,214,120') {
  for (let i = 0; i < n; i++) {
    const sp = 40 + rnd(i) * 90, x = rnd(i + 1) * W + Math.sin(t * .7 + i) * 30;
    const y = H - ((t * sp + rnd(i + 2) * H * 1.2) % (H * 1.2));
    const r = 1.5 + rnd(i + 3) * 3.5, a = .3 + .6 * Math.abs(Math.sin(t * 1.5 + i));
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = `rgba(${col},${a})`; ctx.fill();
  }
}
function perspectiveGrid(t, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = 'rgba(138,91,255,.5)'; ctx.lineWidth = 2;
  const hz = 1250, vx = W / 2;
  for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(vx, hz); ctx.lineTo(vx + i * 260, H + 200); ctx.stroke(); }
  for (let k = 0; k < 14; k++) { const z = ((k + (t * 1.2) % 1) / 14); const y = hz + Math.pow(z, 2.2) * (H - hz + 200); ctx.globalAlpha = alpha * z; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
}
function background(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.night0); g.addColorStop(.55, C.night1); g.addColorStop(1, C.night2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  aurora(t, 1);
  particles(t, 45);
}

// ---------- logo badge ----------
function dogFace(s) { // vector stand-in for the emblem
  ctx.save(); ctx.scale(s, s);
  ctx.fillStyle = '#d9894a';
  ctx.beginPath(); ctx.moveTo(-95, -40); ctx.lineTo(-80, -140); ctx.lineTo(-25, -85); ctx.fill();
  ctx.beginPath(); ctx.moveTo(95, -40); ctx.lineTo(80, -140); ctx.lineTo(25, -85); ctx.fill();
  ctx.fillStyle = '#ffb3b3'; ctx.beginPath(); ctx.moveTo(-82, -60); ctx.lineTo(-76, -118); ctx.lineTo(-45, -88); ctx.fill(); ctx.beginPath(); ctx.moveTo(82, -60); ctx.lineTo(76, -118); ctx.lineTo(45, -88); ctx.fill();
  ctx.fillStyle = '#e99a56'; ctx.beginPath(); ctx.ellipse(0, 0, 110, 100, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3e4'; ctx.beginPath(); ctx.ellipse(0, 45, 70, 52, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-48, -18, 22, 16, 0, 0, 7); ctx.ellipse(48, -18, 22, 16, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b1530'; ctx.beginPath(); ctx.ellipse(-44, -18, 13, 15, 0, 0, 7); ctx.ellipse(44, -18, 13, 15, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-40, -23, 5, 0, 7); ctx.arc(48, -23, 5, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b1530'; ctx.beginPath(); ctx.ellipse(0, 22, 20, 14, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1b1530'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 34); ctx.lineTo(0, 50); ctx.moveTo(-26, 58); ctx.quadraticCurveTo(0, 74, 26, 58); ctx.stroke();
  ctx.fillStyle = '#ff6b8a'; ctx.beginPath(); ctx.ellipse(6, 76, 14, 18, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function logoBadge(x, y, R, t, ringP = 1) {
  ctx.save(); ctx.translate(x, y);
  // glow
  const gl = ctx.createRadialGradient(0, 0, R * .6, 0, 0, R * 1.9); gl.addColorStop(0, 'rgba(255,190,80,.45)'); gl.addColorStop(1, 'rgba(255,190,80,0)');
  ctx.fillStyle = gl; ctx.fillRect(-R * 2, -R * 2, R * 4, R * 4);
  if (false) {
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.clip();
    const k = Math.max(2 * R / logoImg.width, 2 * R / logoImg.height);
    ctx.drawImage(logoImg, -logoImg.width * k / 2, -logoImg.height * k / 2, logoImg.width * k, logoImg.height * k); ctx.restore();
  } else {
    const bg = ctx.createLinearGradient(0, -R, 0, R); bg.addColorStop(0, '#1d2a6b'); bg.addColorStop(1, '#0b1033');
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fillStyle = bg; ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.clip(); ctx.globalAlpha = .9; burj(0, R * .95, R * .9, 'rgba(255,201,74,.18)'); ctx.restore();
    txt('@', 0, -R * .1, R * 1.05, goldGrad(-R * .6, R * .6), { glow: 'rgba(255,190,80,.55)', glowR: R * .25 });
    // curved text
    ctx.save(); font(R * .13, 900); ctx.fillStyle = C.gold; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const str = 'AZIZ · DUBAI · GUIDE', step = .118; const start = Math.PI / 2 + (str.length - 1) * step / 2;
    [...str].forEach((ch, i) => { const a = start - i * step; ctx.save(); ctx.rotate(a); ctx.translate(R * .8, 0); ctx.rotate(-Math.PI / 2); ctx.fillText(ch, 0, 0); ctx.restore(); });
    ctx.restore();
  }
  // gold ring
  ctx.lineWidth = R * .07; ctx.strokeStyle = goldGrad(-R, R);
  ctx.beginPath(); ctx.arc(0, 0, R * 1.02, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ringP); ctx.stroke();
  // orbiting dashes
  ctx.save(); ctx.rotate(t * .6); ctx.setLineDash([4, 26]); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,214,120,.7)'; ctx.beginPath(); ctx.arc(0, 0, R * 1.22, 0, Math.PI * 2 * ringP); ctx.stroke(); ctx.restore();
  ctx.restore();
}

// ---------- watermark ----------
// =====================================================================
//  v3 SCENES — timed to the voiceover (assets/voiceover.wav, word timings
//  from speech recognition). VO starts at t = 0.
// =====================================================================
const photo = new Image(); let photoOK = false; photo.onload = () => { photoOK = true; }; photo.src = 'assets/aziz_photo.jpg';
const T = {"hook1": [0.3, 1.158], "hook2": [1.358, 2.758], "who1": [3.158, 4.568], "who2": [4.768, 7.232], "tk_title": [7.632, 8.641], "tk1": [8.941, 9.761], "tk2": [10.611, 11.165], "tk3": [12.115, 13.045], "tk4": [13.895, 14.215], "tk5": [15.265, 16.475], "tk6": [17.325, 18.095], "tk7": [18.945, 19.975], "chat1": [20.475, 22.495], "chat2": [22.745, 23.589], "pay_title_a": [24.039, 24.389], "pay_title_b": [24.469, 25.239], "pay_cash": [25.639, 26.112], "pay_foreign": [26.662, 28.582], "pay_visa_mc": [28.732, 30.352], "pay_ru": [30.902, 32.242], "cta1": [32.742, 33.407], "cta2": [33.657, 34.488], "_dur": 36.688};
const C1 = T.who1[0] - .25, C2 = T.tk_title[0] - .35, C3 = T.chat1[0] - .35, C4 = T.pay_title_a[0] - .3, C5 = T.cta1[0] - .4;
const CUTS = [C1, C2, C3, C4, C5];

function photoCircle(x, y, R, t, ringP = 1) {
  ctx.save(); ctx.translate(x, y);
  const gl = ctx.createRadialGradient(0, 0, R * .7, 0, 0, R * 1.8); gl.addColorStop(0, 'rgba(255,190,80,.45)'); gl.addColorStop(1, 'rgba(255,190,80,0)');
  ctx.fillStyle = gl; ctx.fillRect(-R * 2, -R * 2, R * 4, R * 4);
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.clip();
  if (photoOK) { const z = 1.04 + .04 * Math.sin(t * .8); ctx.drawImage(photo, -R * z, -R * z, R * 2 * z, R * 2 * z); } else { ctx.fillStyle = '#223'; ctx.fill(); }
  ctx.restore();
  ctx.lineWidth = Math.max(4, R * .045); ctx.strokeStyle = goldGrad(-R, R);
  ctx.beginPath(); ctx.arc(0, 0, R * 1.03, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ringP); ctx.stroke();
  ctx.save(); ctx.rotate(t * .5); ctx.setLineDash([4, 24]); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,214,120,.7)';
  ctx.beginPath(); ctx.arc(0, 0, R * 1.16, 0, Math.PI * 2 * ringP); ctx.stroke(); ctx.restore();
  ctx.restore();
}

// ticket shape with notches + perforation; stub on the right
function ticketPath(w, h, stubX, r = 34, nr = 30) {
  const x = -w / 2, y = -h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(stubX - nr, y); ctx.arc(stubX, y, nr, Math.PI, 0, true);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(stubX + nr, y + h); ctx.arc(stubX, y + h, nr, 0, Math.PI, true);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function ticket(w, h, c1, c2, draw, stubText = 'БИЛЕТ', t = 0) {
  const stubX = w / 2 - 190;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 28;
  const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ticketPath(w, h, stubX); ctx.fillStyle = g; ctx.fill(); ctx.restore();
  ctx.save(); ticketPath(w, h, stubX); ctx.clip();
  // guilloche pattern
  ctx.globalAlpha = .12; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  for (let i = 0; i < 18; i++) { ctx.beginPath(); for (let x = -w / 2; x <= stubX; x += 10) ctx.lineTo(x, -h / 2 + 30 + i * (h / 18) + Math.sin(x * .03 + i) * 10); ctx.stroke(); }
  ctx.globalAlpha = 1;
  // holographic sweep
  const sx = -w + ((t * 650) % (w * 3));
  const sh = ctx.createLinearGradient(sx, -h / 2, sx + 240, h / 2); sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(.5, 'rgba(255,255,255,.3)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh; ctx.fillRect(-w / 2, -h / 2, w, h);
  // stub
  ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(stubX, -h / 2, w / 2 - stubX, h);
  ctx.restore();
  ctx.save(); ctx.setLineDash([10, 12]); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath(); ctx.moveTo(stubX, -h / 2 + 34); ctx.lineTo(stubX, h / 2 - 34); ctx.stroke(); ctx.restore();
  // stub content: vertical label + barcode
  ctx.save(); ctx.translate(stubX + (w / 2 - stubX) / 2, 0); ctx.rotate(-Math.PI / 2);
  txt(stubText, 0, -40, 44, '#fff', { track: 8 });
  ctx.restore();
  ctx.save(); ctx.translate(stubX + (w / 2 - stubX) / 2 + 40, 0); ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0, y = -h / 2 + 60; y < h / 2 - 60; i++) { const bw = 2 + (rnd(i * 3.7) * 6 | 0); ctx.fillRect(-26, y, 52, bw); y += bw + 4 + (rnd(i) * 5 | 0); }
  ctx.restore();
  ctx.save(); ctx.translate(-w / 2, 0); draw(stubX + w / 2); ctx.restore();
}

function watermark(t) {
  const a = (1 - prog(t, C5 - .25, C5 + .15)) * prog(t, .2, .6);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = .65 * a;
  txt(HANDLE, W / 2, 170, 46, '#fff', { w: 700, glow: 'rgba(0,0,0,.6)', glowR: 12 });
  ctx.restore();
}

// S1 · HOOK 0–2.7  «Едете в Дубай? Билеты — у Азиза!»
function S1(t) {
  if (t > C1 + .25) return;
  const ex = exitMask(t, C1 - .15, .35);
  ctx.save(); ctx.translate(0, -ex * 900);
  skyline(t, 1560, 1, eOut5(prog(t, 0, 1.1)));
  const up = eOut(prog(t, T.hook2[0] - .35, T.hook2[0] + .15));
  ctx.save(); ctx.translate(0, -up * 150);
  reveal('ЕДЕТЕ', W / 2, 520, 200, 'rgba(255,255,255,.95)', t, .3, .45, { stroke: 5 });
  reveal('В ДУБАЙ?', W / 2, 710, 180, goldGrad(620, 800), t, .6, .45, { glow: 'rgba(255,170,60,.6)' });
  ctx.restore();
  // golden ticket slams in on «Билеты — у Азиза»

  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // beat-synced light flash on scene cuts
  CUTS.forEach(c => { const f = 1 - prog(t, c, c + .25); if (t >= c && f > 0) { ctx.fillStyle = `rgba(255,240,220,${.35 * f * f})`; ctx.fillRect(0, 0, W, H); } });
  // light leak sweep
  const lx = ((t * .23) % 1.6 - .3) * W; const lg = ctx.createLinearGradient(lx - 300, 0, lx + 300, H * .4);
  lg.addColorStop(0, 'rgba(255,140,60,0)'); lg.addColorStop(.5, 'rgba(255,140,60,.10)'); lg.addColorStop(1, 'rgba(255,140,60,0)');
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H); ctx.restore();
  // film grain
  ctx.save(); ctx.globalAlpha = .06; ctx.globalCompositeOperation = 'overlay';
  const ox = (t * 977) % 256, oy = (t * 613) % 256; ctx.translate(-ox, -oy);
  for (let y = 0; y < H + 256; y += 256) for (let x = 0; x < W + 256; x += 256) ctx.drawImage(NOISE, x, y);
  ctx.restore();
  // fade in
  const fi = 1 - prog(t, 0, .25); if (fi > 0) { ctx.fillStyle = `rgba(0,0,0,${fi})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- camera shake on hits ----------
function shake(t) {
  let a = 0; [...CUTS, T.hook2[0] + .25].forEach(c => { if (t >= c) a += 14 * Math.exp(-(t - c) * 12); });
  return [Math.sin(t * 90) * a, Math.cos(t * 77) * a];
}

function drawFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  background(t);
  const [sx, sy] = shake(t); ctx.save(); ctx.translate(sx, sy);
  S1(t); S2(t); S3(t); S4(t); S5(t); S6(t);
  ctx.restore();
  watermark(t);
  finish(t);
}

// motion blur: average sub-frames across a 180° shutter
const SUB = 4, SHUTTER = .5 / FPS;
function renderAt(t) {
  octx.globalAlpha = 1; octx.globalCompositeOperation = 'source-over';
  for (let k = 0; k < SUB; k++) {
    drawFrame(t + (k / SUB - .5) * SHUTTER);
    octx.globalAlpha = 1 / (k + 1); octx.drawImage(buf, 0, 0);
  }
  octx.globalAlpha = 1;
}
window.renderFrame = i => renderAt(i / FPS);
window.TOTAL = Math.round(DUR * FPS);
window.logoReady = () => logoOK;

if (!window.__RENDER__) {
  const st = performance.now();
  (function loop() { renderAt(((performance.now() - st) / 1000) % DUR); requestAnimationFrame(loop); })();
}
