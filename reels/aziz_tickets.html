<!doctype html>
<html><head><meta charset="utf-8"><title>Билеты у Азиза</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:360px;height:640px}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = 19;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const F = 'Inter, "Inter Display", sans-serif';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const elastic = x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1;
const lerp = (a, b, x) => a + (b - a) * x;
function rnd(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(str, x, y, size, color, weight = 800, align = 'center') {
  ctx.font = `${weight} ${size}px ${F}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}
function shadowText(str, x, y, size, color, weight = 800, align = 'center') {
  ctx.save(); ctx.shadowColor = 'rgba(0,40,60,.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  text(str, x, y, size, color, weight, align); ctx.restore();
}
// word-by-word pop-in text
function popWords(str, x, y, size, color, t0, t, stagger = .07, weight = 800) {
  ctx.font = `${weight} ${size}px ${F}`;
  const words = str.split(' '); const space = size * .28;
  const widths = words.map(w => ctx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  let cx = x - total / 2;
  words.forEach((w, i) => {
    const p = prog(t, t0 + i * stagger, t0 + i * stagger + .45);
    if (p > 0) {
      ctx.save(); ctx.globalAlpha *= clamp(p * 2);
      const s = backOut(p); const wx = cx + widths[i] / 2;
      ctx.translate(wx, y + (1 - easeOut(p)) * 60); ctx.scale(s, s);
      shadowText(w, 0, 0, size, color, weight); ctx.restore();
    }
    cx += widths[i] + space;
  });
}

// ---------- background ----------
function background(t) {
  const shift = Math.sin(t * .4) * .5 + .5;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${lerp(195, 205, shift)},85%,58%)`);
  g.addColorStop(.55, `hsl(${lerp(185, 175, shift)},75%,62%)`);
  g.addColorStop(1, `hsl(${lerp(42, 35, shift)},95%,66%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // sun glow
  const sx = 820, sy = 330 + Math.sin(t * .8) * 15;
  const sg = ctx.createRadialGradient(sx, sy, 20, sx, sy, 420);
  sg.addColorStop(0, 'rgba(255,245,200,.95)'); sg.addColorStop(.25, 'rgba(255,225,140,.55)'); sg.addColorStop(1, 'rgba(255,220,140,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  ctx.beginPath(); ctx.arc(sx, sy, 110, 0, 7); ctx.fillStyle = '#fff3c4'; ctx.fill();

  // soft clouds
  for (let i = 0; i < 4; i++) {
    const cx = ((rnd(i) * W + t * (20 + i * 12)) % (W + 500)) - 250, cy = 150 + i * 160;
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(cx, cy, 140, 38, 0, 0, 7); ctx.ellipse(cx + 70, cy - 25, 90, 40, 0, 0, 7); ctx.fill();
  }

  // waves at the bottom
  const layers = [
    { y: 1600, a: 22, c: 'rgba(255,255,255,.25)', sp: 1.2, k: .009 },
    { y: 1680, a: 26, c: 'rgba(0,150,180,.35)', sp: 1.6, k: .007 },
    { y: 1770, a: 30, c: 'rgba(0,110,150,.45)', sp: 2.1, k: .006 },
  ];
  layers.forEach((L, li) => {
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 12) ctx.lineTo(x, L.y + Math.sin(x * L.k + t * L.sp + li) * L.a);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = L.c; ctx.fill();
  });

  // palms
  palm(70, 1650, 1, t); palm(1020, 1700, -1, t + 1);

  // floating sparkles / bubbles
  for (let i = 0; i < 26; i++) {
    const px = rnd(i + 3) * W, speed = 30 + rnd(i + 9) * 60;
    const py = H - ((t * speed + rnd(i + 5) * H) % (H + 100));
    const r = 4 + rnd(i + 7) * 10, a = .25 + .35 * Math.sin(t * 2 + i);
    ctx.beginPath(); ctx.arc(px + Math.sin(t + i) * 20, py, r, 0, 7);
    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
  }
}
function palm(x, y, dir, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
  ctx.strokeStyle = 'rgba(20,60,70,.55)'; ctx.lineWidth = 26; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 300); ctx.quadraticCurveTo(40, 120, 10, -60); ctx.stroke();
  ctx.fillStyle = 'rgba(20,80,70,.6)';
  for (let i = 0; i < 6; i++) {
    const ang = -Math.PI / 2 + (i - 2.5) * .55 + Math.sin(t * 1.5 + i) * .06;
    ctx.save(); ctx.translate(10, -60); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(110, -50, 230, 30); ctx.quadraticCurveTo(110, 10, 0, 0); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// ---------- icons (vector, 100x100 box centered at 0,0) ----------
const ICON = {
  landmark(c) { // columns building
    ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(-40, -15); ctx.lineTo(0, -42); ctx.lineTo(40, -15); ctx.closePath(); ctx.fill();
    for (let i = 0; i < 4; i++) ctx.fillRect(-34 + i * 21, -8, 10, 38);
    ctx.fillRect(-42, 32, 84, 9);
  },
  water(c) { // waves + drop
    ctx.strokeStyle = c; ctx.lineWidth = 7; ctx.lineCap = 'round';
    for (let k = 0; k < 2; k++) { ctx.beginPath(); for (let x = -40; x <= 40; x += 4) ctx.lineTo(x, 18 + k * 18 + Math.sin(x * .15) * 6); ctx.stroke(); }
    ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, -45); ctx.quadraticCurveTo(22, -15, 0, 2); ctx.quadraticCurveTo(-22, -15, 0, -45); ctx.fill();
  },
  wheel(c, t) { // ferris wheel
    ctx.strokeStyle = c; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, -8, 32, 0, 7); ctx.stroke();
    ctx.save(); ctx.translate(0, -8); ctx.rotate(t * 1.5);
    for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(32, 0); ctx.stroke(); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(32, 0, 6, 0, 7); ctx.fill(); }
    ctx.restore();
    ctx.beginPath(); ctx.moveTo(-22, 42); ctx.lineTo(0, -8); ctx.lineTo(22, 42); ctx.stroke();
  },
  yacht(c) {
    ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(-42, 18); ctx.lineTo(42, 18); ctx.lineTo(28, 36); ctx.lineTo(-30, 36); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(2, -44); ctx.lineTo(2, 12); ctx.lineTo(34, 12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4, -34); ctx.lineTo(-4, 12); ctx.lineTo(-30, 12); ctx.closePath(); ctx.fill();
  },
  safari(c) { // sun over dunes
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(14, -16, 16, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-46, 38); ctx.quadraticCurveTo(-20, -6, 10, 20); ctx.quadraticCurveTo(30, 4, 46, 16); ctx.lineTo(46, 38); ctx.closePath(); ctx.fill();
  },
  bus(c) {
    ctx.fillStyle = c; rr(-40, -34, 80, 60, 12); ctx.fill();
    ctx.fillStyle = '#fff'; rr(-32, -26, 64, 22, 5); ctx.fill();
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(-22, 30, 10, 0, 7); ctx.arc(22, 30, 10, 0, 7); ctx.fill();
  },
  people(c) {
    ctx.fillStyle = c;
    [[-24, .8], [24, .8], [0, 1]].forEach(([x, s]) => {
      ctx.beginPath(); ctx.arc(x, -18 * s, 13 * s, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x, 24, 22 * s, 22 * s, 0, Math.PI, 0); ctx.fill();
    });
  },
  globe(c) {
    ctx.strokeStyle = c; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 34, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(34, 0); ctx.moveTo(-28, -17); ctx.lineTo(28, -17); ctx.moveTo(-28, 17); ctx.lineTo(28, 17); ctx.stroke();
  },
};
function iconBadge(name, x, y, size, bg, fg, t) {
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath(); ctx.arc(0, 0, size / 2, 0, 7); ctx.fillStyle = bg; ctx.fill();
  const s = size / 130; ctx.scale(s, s); ICON[name](fg, t); ctx.restore();
}

// ---------- scenes ----------
// Scene 1: hook 0 – 3.4
function scene1(t) {
  const out = prog(t, 3.0, 3.4);
  ctx.save(); ctx.globalAlpha = 1 - out; ctx.translate(0, -out * 120);
  popWords('Планируете', W / 2, 640, 104, '#fff', .2, t);
  popWords('отдых мечты?', W / 2, 770, 104, '#fff', .45, t);

  // ticket badge drop-in
  const p = prog(t, 1.2, 2.0);
  if (p > 0) {
    ctx.save(); ctx.translate(W / 2, 1060); ctx.rotate((1 - elastic(p)) * .5 - .04); ctx.scale(elastic(p), elastic(p));
    ticketShape(-380, -120, 760, 240, '#ff5a5f');
    text('БИЛЕТЫ', 0, -42, 64, '#fff', 900);
    text('у Азиза', 0, 42, 92, '#fff', 900);
    ctx.restore();
  }
  const p2 = prog(t, 1.9, 2.4);
  if (p2 > 0) {
    ctx.save(); ctx.globalAlpha *= p2; ctx.translate(W / 2, 1290 + (1 - p2) * 30);
    rr(-400, -50, 800, 100, 50); ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill();
    text('выгодно · удобно · по-дружески', 0, 3, 46, '#16324a', 800); ctx.restore();
  }
  ctx.restore();
}
function ticketShape(x, y, w, h, color) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  ctx.beginPath();
  ctx.moveTo(x + 30, y); ctx.lineTo(x + w - 30, y); ctx.quadraticCurveTo(x + w, y, x + w, y + 30);
  ctx.lineTo(x + w, y + h / 2 - 30); ctx.arc(x + w, y + h / 2, 30, -Math.PI / 2, Math.PI / 2, true);
  ctx.lineTo(x + w, y + h - 30); ctx.quadraticCurveTo(x + w, y + h, x + w - 30, y + h);
  ctx.lineTo(x + 30, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - 30);
  ctx.lineTo(x, y + h / 2 + 30); ctx.arc(x, y + h / 2, 30, Math.PI / 2, -Math.PI / 2, true);
  ctx.lineTo(x, y + 30); ctx.quadraticCurveTo(x, y, x + 30, y); ctx.closePath();
  ctx.fillStyle = color; ctx.fill(); ctx.restore();
  ctx.save(); ctx.setLineDash([14, 12]); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 4;
  rr(x + 22, y + 22, w - 44, h - 44, 20); ctx.stroke(); ctx.restore();
}

// Scene 2: categories 3.3 – 10
const CATS = [
  ['landmark', 'Достопримечательности', '#ff7a59'],
  ['water', 'Аквапарки', '#1fb6e0'],
  ['wheel', 'Парки развлечений', '#a66cff'],
  ['yacht', 'Яхты', '#2f80ed'],
  ['safari', 'Сафари', '#f2994a'],
  ['bus', 'Обзорные экскурсии', '#27ae60'],
  ['people', 'Индивидуальные и|групповые экскурсии', '#eb5793'],
];
function scene2(t) {
  const t0 = 3.3, out = prog(t, 9.6, 10.0);
  if (t < t0 || out >= 1) return;
  ctx.save(); ctx.globalAlpha = 1 - out;
  popWords('Билеты у меня —', W / 2, 250, 76, '#fff', t0, t);
  popWords('всё в одном месте', W / 2, 345, 76, '#fff', t0 + .25, t);
  const top = 470, gap = 168;
  CATS.forEach(([ic, label, col], i) => {
    const st = t0 + .7 + i * .5;
    const p = prog(t, st, st + .55);
    if (p <= 0) return;
    const e = backOut(p);
    const y = top + i * gap, x = W / 2;
    const fromLeft = i % 2 === 0;
    const slide = (1 - e) * (fromLeft ? -900 : 900);
    const bob = Math.sin(t * 2.2 + i) * 5;
    ctx.save(); ctx.translate(x + slide - out * (fromLeft ? 300 : -300), y + bob);
    ctx.shadowColor = 'rgba(0,50,70,.25)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
    rr(-450, 0, 900, 136, 68); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
    ctx.shadowColor = 'transparent';
    iconBadge(ic, -382, 68, 108, col, '#fff', t);
    if (label.includes('|')) { const [a, b] = label.split('|'); text(a, -305, 46, 44, '#16324a', 800, 'left'); text(b, -305, 96, 44, '#16324a', 800, 'left'); }
    else text(label, -305, 70, label.length > 20 ? 50 : 56, '#16324a', 800, 'left');
    // check mark pop
    const pc = prog(t, st + .35, st + .7);
    if (pc > 0) {
      ctx.save(); ctx.translate(390, 68); ctx.scale(backOut(pc), backOut(pc));
      ctx.beginPath(); ctx.arc(0, 0, 26, 0, 7); ctx.fillStyle = col; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(-11, 1); ctx.lineTo(-3, 10); ctx.lineTo(12, -9); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  });
  ctx.restore();
}

// Scene 3: выгодно 9.9 – 13
function scene3(t) {
  const t0 = 9.9, out = prog(t, 12.7, 13.1);
  if (t < t0 || out >= 1) return;
  ctx.save(); ctx.globalAlpha = 1 - out;
  // burst rays
  const pr = easeOut(prog(t, t0, t0 + .6));
  ctx.save(); ctx.translate(W / 2, 820); ctx.rotate(t * .25);
  for (let i = 0; i < 16; i++) {
    ctx.rotate(Math.PI / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-60 * pr, 900 * pr); ctx.lineTo(60 * pr, 900 * pr); ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fill();
  }
  ctx.restore();
  // price tag swinging
  const p = prog(t, t0 + .1, t0 + .9);
  if (p > 0) {
    const swing = Math.sin((t - t0) * 5) * Math.exp(-(t - t0) * 1.4) * .35;
    ctx.save(); ctx.translate(W / 2, 520); ctx.rotate(swing); ctx.scale(elastic(p), elastic(p));
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(0, 30); ctx.stroke();
    ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
    ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(170, 120); ctx.lineTo(170, 520); ctx.lineTo(-170, 520); ctx.lineTo(-170, 120); ctx.closePath();
    ctx.fillStyle = '#ffd34d'; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.beginPath(); ctx.arc(0, 110, 22, 0, 7); ctx.fillStyle = '#e8a800'; ctx.fill();
    text('%', 0, 330, 260, '#ff5a5f', 900);
    ctx.restore();
  }
  popWords('ВЫГОДНО', W / 2, 1200, 150, '#fff', t0 + .6, t, .1, 900);
  const p3 = prog(t, t0 + 1.2, t0 + 1.7);
  if (p3 > 0) {
    ctx.globalAlpha *= p3;
    shadowText('Лучшие цены на билеты', W / 2, 1340 + (1 - p3) * 30, 60, '#fff', 800);
    shadowText('без переплат и очередей', W / 2, 1420 + (1 - p3) * 30, 60, '#fff', 800);
  }
  ctx.restore();
}

// Scene 4: оплата 13 – 16.4
function bankCard(x, y, w, h, c1, c2, title, sub, iconFn, t) {
  ctx.save(); ctx.translate(x, y);
  ctx.shadowColor = 'rgba(0,30,60,.35)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
  const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); g.addColorStop(0, c1); g.addColorStop(1, c2);
  rr(-w / 2, -h / 2, w, h, 36); ctx.fillStyle = g; ctx.fill(); ctx.shadowColor = 'transparent';
  // shine
  ctx.save(); rr(-w / 2, -h / 2, w, h, 36); ctx.clip();
  const sx = -w + ((t * 500) % (w * 2.5));
  const sg = ctx.createLinearGradient(sx, 0, sx + 200, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.28)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.restore();
  // chip
  rr(-w / 2 + 50, -h / 2 + 60, 90, 66, 12); ctx.fillStyle = '#f5d27a'; ctx.fill();
  ctx.strokeStyle = 'rgba(150,110,20,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-w / 2 + 95, -h / 2 + 60); ctx.lineTo(-w / 2 + 95, -h / 2 + 126); ctx.moveTo(-w / 2 + 50, -h / 2 + 93); ctx.lineTo(-w / 2 + 140, -h / 2 + 93); ctx.stroke();
  iconFn(w / 2 - 90, -h / 2 + 95);
  text('••••  ••••  ••••  ' + (title.length % 10) + '24' + (sub.length % 10), -w / 2 + 50, 10, 40, 'rgba(255,255,255,.85)', 600, 'left');
  text(title, -w / 2 + 50, h / 2 - 95, 44, '#fff', 800, 'left');
  text(sub, -w / 2 + 50, h / 2 - 45, 34, 'rgba(255,255,255,.85)', 600, 'left');
  ctx.restore();
}
function scene4(t) {
  const t0 = 13.0, out = prog(t, 16.1, 16.5);
  if (t < t0 || out >= 1) return;
  ctx.save(); ctx.globalAlpha = 1 - out;
  popWords('Оплата —', W / 2, 260, 88, '#fff', t0, t);
  popWords('как вам удобно', W / 2, 370, 88, '#fff', t0 + .2, t);
  const cw = 820, ch = 460;
  const p1 = prog(t, t0 + .4, t0 + 1.1), p2 = prog(t, t0 + .9, t0 + 1.6);
  if (p1 > 0) {
    ctx.save(); const e = backOut(p1);
    ctx.translate(W / 2 + (1 - e) * -1000, 720); ctx.rotate((1 - e) * -.3 - .03 + Math.sin(t * 1.6) * .015);
    bankCard(0, 0, cw, ch, '#1e3c72', '#2a9df4', 'Перевод на иностранную карту', 'Visa · Mastercard · любая страна',
      (x, y) => { ctx.save(); ctx.translate(x, y); ctx.scale(.9, .9); ICON.globe('#fff'); ctx.restore(); }, t);
    ctx.restore();
  }
  if (p2 > 0) {
    ctx.save(); const e = backOut(p2);
    ctx.translate(W / 2 + (1 - e) * 1000, 1250); ctx.rotate((1 - e) * .3 + .03 + Math.sin(t * 1.6 + 1) * .015);
    bankCard(0, 0, cw, ch, '#0f9b58', '#21c97a', 'На карту российского банка', 'перевод в рублях · быстро',
      (x, y) => { ctx.save(); ctx.translate(x, y); ctx.beginPath(); ctx.arc(0, 0, 42, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fill(); text('₽', 0, 4, 64, '#fff', 900); ctx.restore(); }, t);
    ctx.restore();
  }
  const p3 = prog(t, t0 + 1.7, t0 + 2.2);
  if (p3 > 0) { ctx.globalAlpha *= p3; shadowText('Для туристов из любой страны', W / 2, 1620 + (1 - p3) * 30, 56, '#fff', 800); }
  ctx.restore();
}

// Scene 5: CTA 16.3 – 19
function heart(x, y, s, c) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = c;
  ctx.beginPath(); ctx.moveTo(0, 12); ctx.bezierCurveTo(-30, -10, -16, -34, 0, -18); ctx.bezierCurveTo(16, -34, 30, -10, 0, 12); ctx.fill(); ctx.restore();
}
function scene5(t) {
  const t0 = 16.3; if (t < t0) return;
  // confetti / hearts
  for (let i = 0; i < 40; i++) {
    const st = t0 + rnd(i) * .6, p = prog(t, st, st + 2.5);
    if (p <= 0) continue;
    const ang = rnd(i + 2) * Math.PI * 2, dist = 200 + rnd(i + 4) * 600;
    const x = W / 2 + Math.cos(ang) * dist * easeOut(p), y = 900 + Math.sin(ang) * dist * easeOut(p) + p * p * 300;
    ctx.save(); ctx.globalAlpha = 1 - p;
    if (i % 3 === 0) heart(x, y, 1.4 + rnd(i) * .8, '#ff5a7a');
    else { ctx.translate(x, y); ctx.rotate(t * 4 + i); ctx.fillStyle = ['#ffd34d', '#fff', '#ff7a59', '#a66cff'][i % 4]; ctx.fillRect(-10, -5, 20, 10); }
    ctx.restore();
  }
  popWords('Покупайте', W / 2, 430, 96, '#fff', t0, t);
  popWords('билеты у Азиза', W / 2, 545, 96, '#fff', t0 + .2, t);

  const p = prog(t, t0 + .5, t0 + 1.2);
  if (p > 0) {
    ctx.save(); ctx.translate(W / 2, 880); const s = elastic(p) * (1 + Math.sin(t * 4) * .02); ctx.scale(s, s);
    ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
    rr(-430, -170, 860, 340, 60); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
    heart(-330, -60, 2.4, '#ff5a7a');
    text('Всё по-дружески:', 40, -80, 54, '#16324a', 800);
    text('подскажу, подберу', 40, 0, 54, '#16324a', 700);
    text('и помогу с отдыхом', 40, 80, 54, '#16324a', 700);
    ctx.restore();
  }
  const p2 = prog(t, t0 + 1.2, t0 + 1.8);
  if (p2 > 0) {
    ctx.save(); ctx.globalAlpha = p2;
    const pulse = 1 + Math.sin(t * 6) * .04;
    ctx.translate(W / 2, 1260 + (1 - easeOut(p2)) * 80); ctx.scale(pulse, pulse);
    ctx.shadowColor = 'rgba(255,90,95,.6)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 10;
    rr(-380, -80, 760, 160, 80); const g = ctx.createLinearGradient(-380, 0, 380, 0); g.addColorStop(0, '#ff5a5f'); g.addColorStop(1, '#ff8a3d'); ctx.fillStyle = g; ctx.fill();
    ctx.shadowColor = 'transparent';
    text('Пишите мне в директ', 0, 4, 58, '#fff', 900);
    ctx.restore();
  }
  const p3 = prog(t, t0 + 1.7, t0 + 2.2);
  if (p3 > 0) { ctx.save(); ctx.globalAlpha = p3; shadowText('Парки · Аквапарки · Яхты · Сафари · Экскурсии', W / 2, 1450, 38, '#fff', 700); ctx.restore(); }
}

// ---------- frame ----------
function renderAt(t) {
  ctx.clearRect(0, 0, W, H);
  background(t);
  if (t < 3.4) scene1(t);
  scene2(t); scene3(t); scene4(t); scene5(t);
  // intro / outro fade
  const fi = 1 - prog(t, 0, .35), fo = prog(t, DUR - .4, DUR);
  const a = Math.max(fi, fo);
  if (a > 0) { ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(0, 0, W, H); }
}
window.renderFrame = i => renderAt(i / FPS);
window.TOTAL = DUR * FPS;

// live preview when opened in a browser
if (!window.__RENDER__) {
  const start = performance.now();
  (function loop() { renderAt(((performance.now() - start) / 1000) % DUR); requestAnimationFrame(loop); })();
}
</script></body></html>
